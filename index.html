}
.container { max-width: 720px; margin: 0 auto; background: var(--card); border-radius: 20px; padding: 28px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
.title-row { display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
h1 { font-size: 24px; }
.subtitle { text-align: center; color: var(--text-dim); margin-bottom: 24px; font-size: 13px; }
.btn { display: block; width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit; }
.btn:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn:disabled { cursor: not-allowed; }
.btn.secondary { background: var(--card2); }
.btn.secondary:hover:not(:disabled) { background: var(--border); }
.btn.red { background: var(--eiken-red); }
.btn.red:hover:not(:disabled) { background: #a30000; }
.hidden { display: none !important; }
.chapter-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 16px; }
.chapter-btn { background: var(--card2); padding: 16px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; text-align: left; color: var(--text); font-family: inherit; font-size: 14px; }
.chapter-btn:hover:not(:disabled) { border-color: var(--primary); transform: translateX(4px); }
.chapter-btn .ch-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.chapter-btn .ch-meta { color: var(--text-dim); font-size: 12px; }
.chapter-btn.known { background: rgba(16,185,129,0.15); border: 2px solid var(--success); }
.chapter-btn:disabled { cursor: not-allowed; }
.progress-bar { height: 6px; background: var(--card2); border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--eiken-red)); transition: width 0.3s; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.review-item { background: var(--card2); padding: 12px; border-radius: 9px; margin-bottom: 7px; border-left: 3px solid var(--danger); font-size: 13px; }
.review-item.correct { border-left-color: var(--success); }
.review-item .ri-idiom { font-weight: 700; margin-bottom: 3px; }
.review-item .ri-meaning { color: var(--text-dim); font-size: 12px; }
.review-item .ri-wrong { color: #fca5a5; font-size: 11px; margin-top: 3px; }
@media (max-width: 480px) { .container { padding: 20px 14px; border-radius: 14px; } h1 { font-size: 20px; } }
.question { background: var(--card2); padding: 22px; border-radius: 12px; margin-bottom: 18px; text-align: center; }
.question .id { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
.question .idiom { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
.choices { display: flex; flex-direction: column; gap: 9px; }
.choice { padding: 14px; background: var(--card2); border: 2px solid transparent; border-radius: 10px; text-align: left; cursor: pointer; font-size: 14px; color: var(--text); transition: all 0.15s; font-family: inherit; line-height: 1.5; }
.choice:hover:not(:disabled) { background: var(--border); border-color: var(--primary); }
.choice:disabled { cursor: default; }
.choice.correct { background: rgba(16,185,129,0.2); border-color: var(--success); }
.choice.wrong { background: rgba(239,68,68,0.2); border-color: var(--danger); }
.feedback { margin-top: 14px; padding: 14px 16px; background: rgba(0,0,0,0.25); border-radius: 10px; font-size: 13px; line-height: 1.6; }
.feedback .label { color: var(--gold); font-size: 11px; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 4px; text-transform: uppercase; }
.feedback .ex-en { color: #e2e8f0; margin-bottom: 4px; }
.feedback .ex-ja { color: #94a3b8; font-size: 12px; margin-bottom: 12px; }
.feedback .core { color: #cbd5e1; margin-bottom: 8px; }
.feedback .syn { color: #93c5fd; font-size: 12px; line-height: 1.7; }
.score-display { text-align: center; margin: 28px 0; }
.score-display .num { font-size: 60px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--eiken-red)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.score-display .total { font-size: 22px; color: var(--text-dim); }
.score-message { text-align: center; font-size: 15px; margin-bottom: 20px; }
.review-list { max-height: calc(100vh - 360px); min-height: 200px; overflow-y: auto; margin-bottom: 16px; }
.progress-text { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 12px; color: var(--text-dim); }
@media (max-width: 480px) { .question .idiom { font-size: 22px; } .choice { font-size: 13px; padding: 12px; } }
</style>

<script>const QUIZ_DATA = [{"id": 2101, "idiom": "abide by", "meaning": "～に従う（= live by）", "ex_en": "The boy was warned that if he did not abide by the school rules, he would be expelled.", "ex_ja": "その男の子は、学校の規則に従わなければ退学になると警告された。", "core": "規則・契約・決定など公的なルールを「自分から進んで守る」改まった言い方。法廷や契約書などフォーマルな場面で多用。", "syn": "follow（一般的）／ comply with（要求や規則に従う）／ observe（伝統や決まりを守る）／ stick to（決意を貫く）", "word_key": "abide", "word_def": "(動) (古風) 留まる/我慢する。abide by の形で『〜に従う』。【類】tolerate, endure"}, {"id": 2102, "idiom": "act up", "meaning": "（機械などが）異常に作動する／（人が）羽目を外す（= go rampant）", "ex_en": "At the banquet table, two drunken businessmen were acting up.", "ex_ja": "宴会場で、酔った2人のビジネスマンが羽目を外していた。", "core": "機械の不調、子どもの悪ふざけ、人の異常行動など「いつも通りでない」状況を表す口語。物にも人にも使える。", "syn": "misbehave（人）／ malfunction（機械・堅め）／ play up（英）／ go haywire（機械が暴走）", "word_key": "act up", "word_def": "(句動) 不調の動きをする。子どもや機械に。【関】act out=感情を行動で表す"}, {"id": 2103, "idiom": "add up to", "meaning": "結局～になる（= amount to, lead to）", "ex_en": "Bill's skill at the piano and Joanna's beautiful voice added up to a winning combination.", "ex_ja": "ビルのピアノの腕とジョアンナの美声は、必勝のコンビになった。", "core": "数字の合計だけでなく「結局～という結果になる」という抽象的意味でも使う。要素が積み重なってある結論に至る感覚。", "syn": "amount to（同義）／ come to（合計が～になる）／ result in（結果として）", "word_key": "add up to", "word_def": "(句) 合計が～になる、結果として～を意味する。【類】come to, amount to"}, {"id": 2104, "idiom": "adhere to", "meaning": "～に固執する／～に従う（= cling to）", "ex_en": "I must ask you to adhere to the terms of our agreement and not reveal any information to outsiders.", "ex_ja": "契約条件にしっかり従い、情報を一切外部に漏らすことのないようお願いしたい。", "core": "規則・主義・計画・物理的な「貼り付き」まで幅広く。abide by より固く、信念や戒律にも使える。", "syn": "stick to（決意）／ abide by（規則）／ comply with（要求）／ cling to（離さない）", "word_key": "adhere", "word_def": "(動) (糊などが)くっつく／(信念に)忠実である。adhere to で『～に従う・固執』。【関】adherent=支持者"}, {"id": 2105, "idiom": "atone for", "meaning": "～を償う（= expiate）", "ex_en": "The released prisoner said he had atoned for his crimes.", "ex_ja": "釈放された囚人は、罪を償ったと言った。", "core": "罪・過ちを「償う」。宗教的・道徳的な響きを伴う改まった語。", "syn": "expiate（堅）／ make up for（埋め合わせ）／ make amends for（謝罪含む）／ pay for（罰を受ける）", "word_key": "atone", "word_def": "(動) (罪を)償う、埋め合わせをする。宗教的響きあり。【類】expiate, redeem。【関】atonement=贖罪"}, {"id": 2106, "idiom": "attribute A to B", "meaning": "AはBに起因すると考える", "ex_en": "The writer attributed his success to luck and good teachers.", "ex_ja": "その作家は、自分の成功を運と良い先生たちのおかげだと考えた。", "core": "結果の原因を A は B にあると判断する。良い結果（功績）にも悪い結果（責任）にも使える汎用語。", "syn": "ascribe A to B（同義）／ credit A to B（功績を認める）／ blame B for A（責める）／ put A down to B（口語）", "word_key": "attribute", "word_def": "(動) ～に帰する／(名) 特性。attribute A to B で『AをBに帰する』。【関】attribution=帰属"}, {"id": 2107, "idiom": "bail out", "meaning": "（企業など）を救済する／～を保釈する", "ex_en": "The central bank was criticized for bailing out companies that had made risky loans.", "ex_ja": "リスクの高い融資を行ってきた企業を救済したことで、中央銀行は非難を浴びた。", "core": "経営難の企業を救う、保釈金で身柄を出す、飛行機から脱出するなど多義。文脈で意味が変わる。", "syn": "rescue, save（救う）／ release on bail（保釈）／ parachute out（脱出）", "word_key": "bail", "word_def": "(名) 保釈金 (動) 救済する／水を汲み出す。bail out で多義。【関】on bail=保釈中"}, {"id": 2108, "idiom": "bank on", "meaning": "～を当てにする（= depend on）", "ex_en": "The president always banks on the hard working nature of his employees.", "ex_ja": "社長は従業員の勤勉さをいつも当てにしている。", "core": "結果や人を「確信して頼る」。count on より投資的・確信的なニュアンス。", "syn": "count on, rely on, depend on（一般）／ pin one's hopes on（強い期待）", "word_key": "bank on", "word_def": "(句動) 〜を当てにする。銀行(bank)に預けて頼るイメージから。【類】count on, rely on"}, {"id": 2109, "idiom": "barge into", "meaning": "～にどかどかと入り込む（= thrust into）", "ex_en": "Suddenly, a man barged into the room and began shouting.", "ex_ja": "突然、男が部屋にどかどかと入り込み、叫び始めた。", "core": "ノックや許可なく「無遠慮にどかどか入る」。粗暴さ・無礼さが強調される。", "syn": "burst into（勢いよく）／ force one's way into（強引に）／ intrude on（プライバシー侵害）", "word_key": "barge", "word_def": "(名) 平底船 (動) 押し進む、ぶつかる。barge into で『どかどか入る』。【関】barge in=割り込む"}, {"id": 2110, "idiom": "bawl out", "meaning": "～を叱り飛ばす", "ex_en": "His teacher bawled him out for missing the math test.", "ex_ja": "先生は数学のテストを欠席した彼を叱り飛ばした。", "core": "大声で叱り飛ばす米口語。tell off より激しく一方的。", "syn": "tell off, scold（一般）／ chew out（米俗）／ dress down（堅）／ reprimand（公式）", "word_key": "bawl", "word_def": "(動) 大声で泣く・叫ぶ・どなる。bawl out で『叱り飛ばす』。【類】yell, holler"}, {"id": 2111, "idiom": "be bogged down in", "meaning": "～にはまり込んで進めない（= be tied up with）", "ex_en": "Sorry I couldn't call you last week. I was bogged down in work.", "ex_ja": "先週は電話できなくてごめんね。仕事に追われていたんだ。", "core": "仕事や問題に「はまり込んで身動き取れない」。物理的にぬかるみにはまるイメージから。", "syn": "be tied up with（時間が取られる）／ be swamped with（量が多い）／ be stuck on（解けない問題）", "word_key": "bog", "word_def": "(名) 沼地 (動) ぬかるみにはまる。be bogged down で『行き詰まる』。【関】boggy=沼地の"}, {"id": 2112, "idiom": "be cut out for", "meaning": "～に向いている（= have talent for）", "ex_en": "I quit being a builder because I wasn't cut out for the physical labor.", "ex_ja": "私は肉体労働に向いていなかったので、建築作業員の仕事を辞めた。", "core": "生まれつきの素質や向き不向きを表す。否定形で「向いていない」と使うことが多い。", "syn": "have talent for（才能）／ be suited for（適性）／ be made for（運命的に向く）", "word_key": "be cut out for", "word_def": "(句) (生まれつき)〜に向いている。否定形が多い。【関】cut out=切り抜く"}, {"id": 2113, "idiom": "be geared up for", "meaning": "～の準備が整っている", "ex_en": "Because the students were all geared up for the test, they were quite upset when it was suddenly postponed for a week.", "ex_ja": "学生たちはテストの準備が万端だったので、試験が急に1週間延期されて非常に動揺した。", "core": "試験・試合・イベントに向けて「準備万端の状態」。心理面・物理面の両方。", "syn": "be ready for, be prepared for（一般）／ be all set for（準備完了）／ be primed for（バッチリ）", "word_key": "gear", "word_def": "(名) ギア／装備 (動) 装備する。gear up=準備を整える。【類】prepare, equip"}, {"id": 2114, "idiom": "be keyed up", "meaning": "興奮している（= be strung up）", "ex_en": "He was so keyed up about the forthcoming race that he could not settle down and relax at all.", "ex_ja": "彼は今度のレースのことで興奮していたので、全く落ち着いてリラックスできなかった。", "core": "興奮して落ち着かない状態。試合前のアスリートや発表前の人など、ピリピリした緊張感。", "syn": "be excited（一般）／ be on edge（神経質）／ be wound up（=keyed up）／ be hyped up（米口語）", "word_key": "keyed up", "word_def": "(形) 興奮した、気が立った。鍵を巻き上げてピリピリ張った状態のイメージ。【類】wound up, tense"}, {"id": 2115, "idiom": "bear down on", "meaning": "～に真剣に対処する（= suppress）", "ex_en": "The minister promised that he would bear down on waste and inefficiency.", "ex_ja": "大臣は無駄と非効率に真剣に対処することを約束した。", "core": "問題・無駄などに本気で対処する。「圧力をかけて締めつける」イメージ。", "syn": "crack down on（取り締まる）／ tackle（取り組む）／ get tough on（厳しく対処）", "word_key": "bear down on", "word_def": "(句) 〜に圧力をかけて対処する／〜に迫る。【類】crack down on, push hard on"}, {"id": 2116, "idiom": "bear out", "meaning": "（仮説など）を裏付ける（= support, back up）", "ex_en": "The recently discovered manuscript bears out the theory that Shakespeare spent part of his youth in France.", "ex_ja": "最近発見された原稿は、シェイクスピアが青年時代の一部をフランスで過ごしたという説を裏付けている。", "core": "証拠などが仮説や主張を「裏付ける」。科学・調査・報道で頻出。", "syn": "support, back up（一般）／ confirm（確認する）／ corroborate（堅・裏付ける）", "word_key": "bear out", "word_def": "(句動) (説を)裏付ける。証拠が支える。【類】support, confirm, corroborate"}, {"id": 2117, "idiom": "bear the brunt of", "meaning": "～の矢面に立つ（= assault, attack）", "ex_en": "The soldiers at the front bore the brunt of the attack.", "ex_ja": "前線の兵士たちが攻撃の矢面に立った。", "core": "攻撃・批判の最も激しい部分を真正面から受ける。比喩的に「最大の被害を受ける」。", "syn": "take the brunt of（同義）／ bear the worst of／ take the heat for（責任を被る）", "word_key": "brunt", "word_def": "(名) 矛先、衝撃の主要部。bear the brunt of で『矢面に立つ』。【類】impact, force"}, {"id": 2118, "idiom": "beat up", "meaning": "～をこっぴどく殴る", "ex_en": "The drug dealer was beaten up by members of a rival gang.", "ex_ja": "その麻薬密売人は、敵対組織のメンバーにこっぴどく殴られた。", "core": "相手をひどく殴りつける。物理的暴力で、口げんかには使わない。", "syn": "thrash, batter（強く打つ）／ assault（法律用語）／ rough up（手荒に扱う）", "word_key": "beat up", "word_def": "(句動) (人を)殴る、痛めつける。【類】thrash, batter, assault"}, {"id": 2119, "idiom": "beef about", "meaning": "～のことで文句を言う（= complain about）", "ex_en": "Jim often beefs about his salary.", "ex_ja": "ジムはよく給料のことで文句を言う。", "core": "くだけた口語で「不満を言う」。ぐちぐち長く言うニュアンス。", "syn": "complain about（一般）／ grumble about（ぶつぶつ）／ moan about（英口語）／ gripe about（米口語）", "word_key": "beef", "word_def": "(名) 牛肉／(口語)苦情 (動) 不満を言う。beef about=ぶつぶつ言う／beef up=強化する"}, {"id": 2120, "idiom": "beef up", "meaning": "～を強化する（= strengthen）", "ex_en": "The company headhunted a number of specialists in order to beef up its IT department.", "ex_ja": "その会社はIT部門を強化するために、大勢の専門家をヘッドハンティングした。", "core": "人員・装備・防衛などを「強化する」口語的表現。肉付けして頑丈にするイメージ。", "syn": "strengthen（一般）／ reinforce（補強する）／ bolster（堅・支持）／ shore up（弱った部分を補強）", "word_key": "beef up", "word_def": "(句動) ～を強化する。栄養（beef）を加えるイメージ。【類】strengthen, reinforce"}, {"id": 2121, "idiom": "belt out", "meaning": "～を大声で歌う（= sing out loud）", "ex_en": "At the end of the ceremony, the students belted out the school song.", "ex_ja": "式典の最後に、生徒たちは大声で校歌を歌った。", "core": "思いっきり大声で歌う。情熱的・感情解放的なニュアンス。", "syn": "sing out loud（同義）／ blast out（音を響かせる）／ holler out（米口語で叫ぶ）", "word_key": "belt out", "word_def": "(句動) 大声で歌う／(英)黙れ。【関】belt=ベルト／ぶん殴る／突進する"}, {"id": 2122, "idiom": "black out", "meaning": "（発表など）を抑える（= suppress, silent）", "ex_en": "The government attempted to black out any reference to the dissident.", "ex_ja": "政府はその反体制派への言及を抑えようとした。", "core": "情報・報道を意図的に隠す、または停電する。報道規制に多用。", "syn": "suppress（堅）／ censor（検閲）／ cover up（隠蔽）／ hush up（口外させない）", "word_key": "black out", "word_def": "(句動) 意識を失う／報道を遮断する／停電する。多義。【関】blackout=停電・記憶喪失"}, {"id": 2123, "idiom": "blare out", "meaning": "鳴り響く（= resonate）", "ex_en": "Music blared out from the teenager's room day and night.", "ex_ja": "その10代の若者の部屋から、昼夜音楽が鳴り響いていた。", "core": "音楽・サイレンなどが「けたたましく鳴り響く」。耳障りな大音量を示唆。", "syn": "resonate（共鳴）／ ring out（鐘・声）／ blast out（爆音）／ boom out（低音）", "word_key": "blare", "word_def": "(動) (音が)けたたましく鳴る。【類】blast, bellow。【関】blaring music=爆音音楽"}, {"id": 2124, "idiom": "blot out", "meaning": "～を消し去る（= efface, erase）", "ex_en": "The woman did her best to blot out all memory of the incident.", "ex_ja": "その女性は、事件の記憶をすべて消し去るために最善を尽くした。", "core": "記憶・光・存在を「完全に消し去る」。意識的・徹底的な抹消のイメージ。", "syn": "efface（堅）／ erase（消す）／ wipe out（一掃）／ obliterate（完全消滅）", "word_key": "blot", "word_def": "(名) 染み (動) 汚す／吸い取る／消す。blot out=完全に消す。【関】inkblot=インクの染み"}, {"id": 2125, "idiom": "blow over", "meaning": "（嵐・困難など）が過ぎ去る／（うわさなど）忘れ去られる", "ex_en": "I'm waiting for Europe's debt crisis to blow over before I invest.", "ex_ja": "投資する前に、ヨーロッパの債務危機が過ぎ去るのを待っている。", "core": "嵐・問題・うわさが「自然と過ぎ去る」。能動的に対処せず時間を待つ感覚。", "syn": "die down（弱まる）／ pass（通り過ぎる）／ subside（おさまる）／ peter out（消えていく）", "word_key": "blow over", "word_def": "(句動) (嵐・うわさが) 過ぎ去る、忘れ去られる。【類】die down, subside"}, {"id": 2126, "idiom": "boil down to", "meaning": "～に帰着する（= end up with）", "ex_en": "The dispute between the two countries boiled down to the question of which was the rightful owner of the island.", "ex_ja": "両国間の紛争は、その島の正当な所有国はどちらかという問題に帰着した。", "core": "複雑な議論を「煮詰めると要点は～だ」。本質を抽出するイメージ。", "syn": "come down to（同義）／ amount to（結局～になる）／ reduce to（〜に還元）", "word_key": "boil down to", "word_def": "(句) 結局〜という事に帰着する。煮詰めるイメージ。【類】come down to"}, {"id": 2127, "idiom": "botch up", "meaning": "～をしくじる（= mess up, foul up）", "ex_en": "The police botched up the inquiry and the criminal was never brought to justice.", "ex_ja": "警察が捜査をしくじったため、犯罪者は裁判にかけられることはなかった。", "core": "不器用さ・ミスで「ぶち壊す」。仕事や手順が雑なときに使う口語。", "syn": "mess up, foul up（口語）／ bungle（堅・失敗する）／ blow it（チャンスを台無し）", "word_key": "botch", "word_def": "(動) (仕事を)しくじる、めちゃくちゃにする。【類】bungle, mess up。【関】botched job=ヘマ"}, {"id": 2128, "idiom": "bow out", "meaning": "辞任する", "ex_en": "The retiring chairman said he intended to bow out gracefully.", "ex_ja": "退任の近い会長は、潔く身を引くつもりだと言った。", "core": "地位・競技・舞台などから「身を引く」。優雅に・潔く退くニュアンス。", "syn": "step down（公職）／ retire（引退）／ resign（辞職）／ pull out（撤退）", "word_key": "bow out", "word_def": "(句動) 礼をして退場する→引退・辞退する。【類】step down, retire"}, {"id": 2129, "idiom": "box up", "meaning": "～を箱詰めにする", "ex_en": "Her parents boxed up her belongings and sent them to her.", "ex_ja": "両親は彼女の持ち物を箱に詰めて、彼女に送った。", "core": "物を箱に詰めて整理・梱包する。引っ越し・発送のイメージ。", "syn": "pack up（荷造り）／ crate up（木箱に詰める）／ wrap up（包む）", "word_key": "box up", "word_def": "(句動) 箱詰めにする／追い込む。【類】pack up, crate"}, {"id": 2130, "idiom": "branch out into", "meaning": "～に事業を拡張する（= extend one's business into）", "ex_en": "As it grew, the company began to branch out into new areas of business.", "ex_ja": "会社は成長するにつれ、新しいビジネス分野へ手を伸ばし始めた。", "core": "会社が新分野・新事業に進出する。木が枝分かれするイメージ。", "syn": "expand into（拡張）／ diversify into（多角化）／ venture into（新分野に踏み出す）", "word_key": "branch", "word_def": "(名) 枝・支店 (動) 枝分かれする。branch out=新分野へ進出する。【関】branch office=支店"}, {"id": 2131, "idiom": "break away from", "meaning": "～から脱却する（= pull out of）", "ex_en": "The company said it wanted to break away from its conservative image.", "ex_ja": "その会社は保守的なイメージから脱却したいと述べた。", "core": "過去・伝統・グループから「決別する」。決意を伴う離脱。", "syn": "split from（分裂）／ break with（伝統を破る）／ get away from（離れる）", "word_key": "break away", "word_def": "(句動) 離脱する、独立する。【類】split off, separate"}, {"id": 2132, "idiom": "breeze into", "meaning": "～にすっと入ってくる", "ex_en": "The boy breezed into the classroom twenty minutes late.", "ex_ja": "少年は20分遅刻して、教室にすっと入ってきた。", "core": "そよ風のように「軽やかにすっと入る」。気軽・自信満々な様子。", "syn": "stroll into（のんびり）／ saunter into（ぶらりと）／ waltz into（堂々と・皮肉も）", "word_key": "breeze", "word_def": "(名) そよ風 (動) 軽やかに進む。breeze into=さっと入る／breeze through=楽勝"}, {"id": 2133, "idiom": "brim over with", "meaning": "～でみなぎる（= be full of）", "ex_en": "Her husband was brimming over with resentment at her.", "ex_ja": "彼女の夫は彼女に対する怒りでみなぎっていた。", "core": "感情・液体が「あふれそうなほど満ちる」。中身が外に押し出される強い充満感。", "syn": "be full of（一般）／ overflow with（堅・あふれる）／ teem with（多数）", "word_key": "brim", "word_def": "(名) (帽子・容器の) ふち、縁 (動) 縁までいっぱいになる、あふれそうになる。【関】to the brim=縁まで／a wide-brimmed hat=つば広帽子"}, {"id": 2134, "idiom": "browse through", "meaning": "（本）を拾い読みする", "ex_en": "The students browsed through newspapers and magazines to find topics for their speeches.", "ex_ja": "学生たちはスピーチの題材を見つけるため、新聞や雑誌を拾い読みした。", "core": "本・雑誌を「ぱらぱらめくって眺める」。じっくり読むのではなく軽く目を通す。", "syn": "leaf through（同義）／ skim through（拾い読み）／ flip through（パラパラ）", "word_key": "browse", "word_def": "(動) (本などを)拾い読みする／(店内を)冷やかす／(ネットを)閲覧する。【関】browser=閲覧ソフト"}, {"id": 2135, "idiom": "bubble over with", "meaning": "～で溢れる／湧きあがる", "ex_en": "At the wedding, the bride bubbled over with happiness.", "ex_ja": "結婚式で、花嫁は幸福感に満ち溢れていた。", "core": "brim over with の口語版。喜び・興奮で「はじけそう」な感じが強い。", "syn": "brim over with（同義）／ overflow with／ be bursting with", "word_key": "bubble", "word_def": "(名) 泡 (動) 沸き立つ／(感情で)あふれる。bubble over with で『〜で湧き立つ』"}, {"id": 2136, "idiom": "buckle down to", "meaning": "～に真剣に取り組む", "ex_en": "After he entered university, it took him a while to buckle down to his studies, but as soon as he did he began to get excellent grades.", "ex_ja": "大学入学後、勉強に真剣に取り組むまで時間がかかったが、いざ取り組むと素晴らしい成績を取り始めた。", "core": "怠けていた人が「ぐっと真剣に取り組み始める」。気持ちを切り替えるニュアンス。", "syn": "knuckle down（同義）／ get down to（着手）／ apply oneself to（堅）", "word_key": "buckle", "word_def": "(名) バックル (動) 留める／曲がる。buckle down=本腰を入れる／buckle under=屈する"}, {"id": 2137, "idiom": "bundle up", "meaning": "～を温かく包む（= wrap up）", "ex_en": "She bundled up the baby in a blanket before taking him out.", "ex_ja": "彼女は外に連れ出す前に、毛布で赤ん坊をしっかり包んだ。", "core": "寒さ対策で厚着・毛布で「ぐるぐる包む」。子ども・老人を温める優しいイメージ。", "syn": "wrap up（同義）／ rug up（豪・暖かく着込む）／ pile on layers（重ね着）", "word_key": "bundle", "word_def": "(名) 束 (動) 束ねる／(衣服で)包む。【関】bundle of joy=幸せの塊（赤ん坊）"}, {"id": 2138, "idiom": "bury oneself in", "meaning": "～に没頭する（= be engrossed in）", "ex_en": "The boy buried himself in preparing for his final examinations.", "ex_ja": "少年は期末試験の準備に没頭した。", "core": "仕事・本・趣味に「のめり込む」。周囲が見えなくなるほど没頭。", "syn": "be engrossed in（堅）／ be immersed in（浸かる）／ throw oneself into（飛び込む）", "word_key": "bury", "word_def": "(動) 埋める、葬る。bury oneself in=～に没頭する。【関】buried=埋もれた"}, {"id": 2139, "idiom": "butt in", "meaning": "口出しする（= horn in, cut in）", "ex_en": "As she explained the situation, her husband kept butting in and correcting her remarks.", "ex_ja": "彼女が状況を説明していると、夫が口を挟んで彼女の言葉を訂正し続けた。", "core": "会話に勝手に割り込む無作法な行為。話を遮る。", "syn": "horn in, cut in（同義）／ interrupt（中断）／ chip in（口を挟む・善意も）", "word_key": "butt", "word_def": "(名) (タバコの)吸い殻／お尻／突き当たり (動) 頭で突く。butt in=口出しする"}, {"id": 2140, "idiom": "butter up", "meaning": "～にお世辞を言う（= flatter, apple-polish）", "ex_en": "I hate being buttered up by students who think that compliments will win them a good grade.", "ex_ja": "お世辞を言えば良い成績が取れると思っている学生にこびを売られるのが、私は大嫌いだ。", "core": "好意を引き出すために「お世辞を言って機嫌を取る」。下心ありの褒め。", "syn": "flatter（堅）／ apple-polish（米口語）／ suck up to（こびる）／ kiss up to（ゴマする）", "word_key": "butter up", "word_def": "(句動) お世辞を言う、ゴマをする。バターを塗ってなめらかにするイメージ。【類】flatter, suck up to"}, {"id": 2141, "idiom": "buy off", "meaning": "～を買収する（= bribe）", "ex_en": "The crooked businessman tried to buy off the local police but he was arrested for bribery instead.", "ex_ja": "悪徳実業家は地元の警察を買収しようとしたが、逆に贈賄罪で逮捕された。", "core": "賄賂で口封じや便宜を図らせる。違法・非倫理的な響き。", "syn": "bribe（一般）／ pay off（口止め料）／ grease one's palm（賄賂・口語）", "word_key": "buy off", "word_def": "(句動) 買収する、賄賂で口を封じる。【類】bribe, pay off"}, {"id": 2142, "idiom": "cart A off to B", "meaning": "AをBへ連れ去る", "ex_en": "Eventually, the police carted the men off to the station for questioning.", "ex_ja": "結局、警察は事情聴取のため男たちを警察署へ連行した。", "core": "人を強引に・有無を言わせず連行する。警察の連行や乱暴な移動。", "syn": "haul off to（引きずる）／ whisk away（さっと連れ去る）／ drag off（無理矢理）", "word_key": "cart", "word_def": "(名) カート (動) (重い物を)運ぶ。cart off で『連れ去る』。【関】shopping cart"}, {"id": 2143, "idiom": "carve up", "meaning": "～を分割する（= divide）", "ex_en": "The victorious nations carved up the territory into colonies.", "ex_ja": "戦勝国は領土を分割して植民地にした。", "core": "領土・遺産・市場を「ぶつ切りに分割」する。利害関係者の取り分というニュアンス。", "syn": "divide up（同義）／ partition（分割）／ split up（分ける）／ parcel out（分配）", "word_key": "carve", "word_def": "(動) (肉を)切り分ける／(像を)彫る。carve up=分割する／carve out=切り開く"}, {"id": 2144, "idiom": "cash in on", "meaning": "～に乗じる（= take advantage of, capitalize on）", "ex_en": "In an attempt to cash in on the fashion for things Chinese, the TV channel decided to dramatize a classic Chinese novel.", "ex_ja": "中華ブームに乗じようとして、そのテレビ局は中国の古典小説のドラマ化を決定した。", "core": "流行・ブームを「うまく利用して儲ける」。商売熱心なニュアンス。", "syn": "capitalize on（堅）／ take advantage of（利用）／ exploit（搾取的にも）", "word_key": "cash in on", "word_def": "(句) 〜を金に変える、〜に乗じて利益を得る。【類】capitalize on, profit from"}, {"id": 2145, "idiom": "cast one's mind back to", "meaning": "（昔）のことを思い起こす", "ex_en": "The speaker asked them to cast their minds back to their childhood.", "ex_ja": "話し手は彼らに、子供の頃のことを思い起こすよう頼んだ。", "core": "過去の出来事に「思いを馳せる」。回想・郷愁を伴う表現。", "syn": "look back on（振り返る）／ reflect on（熟考）／ reminisce about（懐かしむ）", "word_key": "cast", "word_def": "(動) 投げる／(視線・票を)向ける／(役を)割り当てる。cast one's mind back=過去を思い起こす"}, {"id": 2146, "idiom": "cave in to", "meaning": "～に屈する（= give in）", "ex_en": "After a few days of fighting, the rebels caved in to the government forces.", "ex_ja": "数日間の戦闘後、反乱軍は政府軍に屈した。", "core": "圧力・要求に「根負けして屈する」。降伏のニュアンス。", "syn": "give in to（同義）／ yield to（堅）／ submit to（服従）／ buckle under（折れる）", "word_key": "cave in", "word_def": "(句動) 陥没する／(圧力に)屈する。【類】give in, collapse, yield"}, {"id": 2147, "idiom": "chalk up", "meaning": "～の記録を達成する（= record）", "ex_en": "Matsui chalked up two more home runs.", "ex_ja": "松井はさらにホームランを2本記録した。", "core": "得点・記録・受賞などを「達成して記録する」。スコアボードに書く感覚。", "syn": "record（一般）／ notch up（記録する）／ rack up（積み上げる）／ score（得点）", "word_key": "chalk", "word_def": "(名) チョーク (動) チョークで書く。chalk up=記録する。【関】chalk up to=～のせいにする"}, {"id": 2148, "idiom": "change over", "meaning": "交代する（= take turns）", "ex_en": "On their journey, the two drivers changed over every few hours.", "ex_ja": "旅行中、2人の運転手は数時間ごとに交代した。", "core": "交代制で役割を入れ替える。長距離運転や夜勤などの場面。", "syn": "take turns（順番）／ switch over（切り替え）／ swap over（交換）", "word_key": "change over", "word_def": "(句動) 切り替わる、交代する。【類】switch over, swap"}, {"id": 2149, "idiom": "chase up", "meaning": "～を探し出す（= ferret out）", "ex_en": "Her boss asked her to chase up any documents concerning the case.", "ex_ja": "上司は彼女に、その件に関するどんな書類でも探し出すよう頼んだ。", "core": "見つからない情報・人を粘り強く追って探し出す。", "syn": "track down（追跡）／ ferret out（嗅ぎ出す）／ hunt down（狩る）", "word_key": "chase up", "word_def": "(句動) 探し出す、催促する。【類】track down, follow up"}, {"id": 2150, "idiom": "choke back", "meaning": "～をこらえる（= hold back）", "ex_en": "Although he was angry, he choked back his complaints and remained silent.", "ex_ja": "彼は怒っていたが、文句を言うのをこらえて黙っていた。", "core": "涙・感情・言葉を必死にこらえる。喉を「ふさぐ」イメージ。", "syn": "hold back（同義）／ suppress（堅）／ stifle（窒息させる）／ swallow back（飲み込む）", "word_key": "choke", "word_def": "(動) 息が詰まる、窒息する。choke back=こらえる／choked up=胸が詰まる"}, {"id": 2151, "idiom": "clam up", "meaning": "黙り込む（= be silent）", "ex_en": "When the teacher questioned the boy, he clammed up immediately.", "ex_ja": "先生がその少年に質問すると、彼はすぐに黙り込んだ。", "core": "質問されても口を閉ざして黙る。貝が殻を閉じるイメージ。", "syn": "go silent（一般）／ shut up（無礼）／ keep mum（口外しない）", "word_key": "clam", "word_def": "(名) ハマグリ (動) 黙り込む。clam up=殻を閉じるように口を閉ざす。【関】happy as a clam=とても幸せ"}, {"id": 2152, "idiom": "claw back", "meaning": "～を必死に取り戻す", "ex_en": "Japan Automobiles is trying to claw back its market share.", "ex_ja": "ジャパン・オートモビルズはマーケットシェアを必死に取り戻そうとしている。", "core": "失った地位・市場・お金を「爪で必死に掻き戻す」イメージ。少しずつ取り戻す。", "syn": "win back（取り戻す）／ regain（堅）／ recoup（埋め合わせ）", "word_key": "claw", "word_def": "(名) 爪、ハサミ (動) 爪で引っかく。claw back=必死に取り戻す。【関】claw machine=クレーンゲーム"}, {"id": 2153, "idiom": "come in for", "meaning": "（非難など）を受ける（= be subjected to）", "ex_en": "After the riot, the police came in for a lot of criticism for their handling of the incident.", "ex_ja": "暴動後、警察は事件の処理について多くの非難を受けた。", "core": "批判・非難・賞賛など「望まないものを浴びせられる」。受動的に受ける。", "syn": "be subjected to（堅）／ receive（受ける）／ attract（引き寄せる）", "word_key": "come in for", "word_def": "(句) (批判・賞賛を) 浴びる、対象になる。【類】receive, be subjected to"}, {"id": 2154, "idiom": "cook up", "meaning": "～をでっち上げる（= fabricate）", "ex_en": "You are late again. Don't even think of cooking up an excuse this time.", "ex_ja": "また遅刻だな。今度はうまい言い訳をでっち上げようなんて思うんじゃないぞ。", "core": "言い訳・話・嘘を「適当にでっち上げる」。料理から転じた口語。", "syn": "fabricate（堅）／ make up（作り上げる）／ concoct（調合する）／ invent（捏造）", "word_key": "cook up", "word_def": "(句動) (話を)でっち上げる／(料理を)さっと作る。【類】fabricate, concoct"}, {"id": 2155, "idiom": "cop out of", "meaning": "～を回避する（= skirt around）", "ex_en": "He accused her of copping out of her duty as a mother.", "ex_ja": "彼は、彼女が母親としての務めを回避していると非難した。", "core": "責任・義務を「ずるく回避する」。卑怯さを伴う口語。", "syn": "shirk（堅・職務怠慢）／ skirt around（避けて通る）／ duck out of（口語・抜ける）", "word_key": "cop out", "word_def": "(句動) (責任から)逃げる。cop=警官／(俗)つかむ。【類】shirk, dodge"}, {"id": 2156, "idiom": "cordon off", "meaning": "～を封鎖する（= block off）", "ex_en": "The police cordoned off the murder scene to prevent members of the public from entering.", "ex_ja": "警察は、市民の立ち入りを防ぐために殺人現場を封鎖した。", "core": "警察などが現場をロープ・テープで「立入禁止に封鎖」する。", "syn": "block off（封鎖）／ seal off（密閉）／ rope off（ロープで仕切る）", "word_key": "cordon", "word_def": "(名) 非常線 (動) (cordon off で) 封鎖する。【類】barricade, seal off"}, {"id": 2157, "idiom": "crack down on", "meaning": "～を厳しく取り締まる", "ex_en": "The principal warned that he was going to crack down on students copying their homework from each other.", "ex_ja": "校長は、生徒同士で宿題を写し合うのを厳しく取り締まると警告した。", "core": "違反・犯罪・悪習に対して「断固として取り締まる」。当局の強硬姿勢。", "syn": "clamp down on（同義）／ crack down（断固）／ get tough on（厳しく）", "word_key": "crack down", "word_def": "(句動) 厳しく取り締まる。割れるほど押さえつけるイメージ。【類】clamp down, get tough"}, {"id": 2158, "idiom": "crack up", "meaning": "精神的に参る／笑い出す", "ex_en": "He cracked up under the pressure of his job and had to spend six months on leave to recover.", "ex_ja": "彼は仕事の重圧に参ってしまい、回復のために6か月の休みを取らざるを得なかった。", "core": "ストレスで「精神的に崩壊する」、または「大笑いする」の二つの意味。", "syn": "break down（崩れる）／ have a meltdown（米口語）／ burst out laughing（爆笑）", "word_key": "crack up", "word_def": "(句動) 神経が参る／大笑いする。【類】break down, lose it"}, {"id": 2159, "idiom": "crank out", "meaning": "～を機械的に量産する", "ex_en": "The thriller writer cranked out a novel a year for ten years.", "ex_ja": "そのスリラー作家は10年間、年に1冊の割合で小説を量産した。", "core": "品質より量を重視して「機械的に量産する」。やや軽蔑的。", "syn": "churn out（同義）／ mass-produce（大量生産）／ pump out（次々と）", "word_key": "crank out", "word_def": "(句動) 機械的に量産する。crank=クランクを回す。【類】churn out, mass-produce"}, {"id": 2160, "idiom": "creep into", "meaning": "～にこっそり忍び込む（= sneak into）", "ex_en": "A suspicion that he was being cheated crept into his mind.", "ex_ja": "自分がだまされているのではないかという疑いが、彼の心に忍び寄った。", "core": "感情・疑念・人がそっと忍び寄る。「いつの間にか」感が強い。", "syn": "sneak into（こっそり）／ steal into（堅）／ slip into（するりと）", "word_key": "creep", "word_def": "(動) こっそり忍び寄る／這う／(植物が)蔓延る。creep into=忍び込む。【関】creepy=不気味"}, {"id": 2161, "idiom": "crop up", "meaning": "（問題などが）急に持ち上がる（= come up）", "ex_en": "The launch of the new car was delayed after a number of small problems cropped up at the last moment.", "ex_ja": "新車の発売は、最後の最後で小さな問題が幾つも発生したために延期された。", "core": "予期せぬ問題・話題が「ひょっこり出てくる」。植物の発芽イメージ。", "syn": "come up（出てくる）／ pop up（突然）／ arise（堅・生じる）", "word_key": "crop up", "word_def": "(句動) (問題が) 急に持ち上がる。crop=作物が芽を出すイメージ。【類】come up, arise"}, {"id": 2162, "idiom": "crouch down", "meaning": "しゃがむ（= hunker down, squat down）", "ex_en": "The children crouched down to watch the ants running about.", "ex_ja": "子供たちはアリが走り回っているのを見るためにしゃがんだ。", "core": "身を低く屈めてしゃがむ。物陰に隠れる、観察するなどの場面。", "syn": "squat down（同義）／ hunker down（じっとうずくまる）／ duck down（さっとかがむ）", "word_key": "crouch", "word_def": "(動) しゃがむ、身を屈める。【類】squat, hunker, duck"}, {"id": 2163, "idiom": "dabble in", "meaning": "～に手を出す", "ex_en": "She dabbled in the stock market and lost some money.", "ex_ja": "彼女は株式市場に手を出し、いくらかのお金を失った。", "core": "趣味や投資に「軽く手を出す」。本気じゃない素人感。", "syn": "tinker with（いじる）／ try one's hand at（試す）／ play around with（遊び半分）", "word_key": "dabble", "word_def": "(動) (水で)はね回る／(趣味に)手を出す。【類】tinker, dally。【関】dabbler=ディレッタント"}, {"id": 2164, "idiom": "dash off", "meaning": "～を一気に仕上げる", "ex_en": "In the end, he dashed off the essay the night before it was due.", "ex_ja": "結局、彼は締切日の前夜にレポートを一気に書き上げた。", "core": "急いで「ささっと書き上げる」。クオリティより速度のニュアンス。", "syn": "knock off（仕上げる）／ scribble out（殴り書き）／ rattle off（すらすら）", "word_key": "dash", "word_def": "(動) 急ぐ／投げつける／殴り書きする。dash off=さっと書き上げる。【類】rush, hurry"}, {"id": 2165, "idiom": "deal out", "meaning": "～を配る", "ex_en": "The foreman dealt out the weekly wages to the gang of laborers.", "ex_ja": "作業班の主任は労務者の集団に週給を配った。", "core": "カード・賃金・物資を「複数の人に配る」。", "syn": "hand out（配布）／ distribute（堅）／ dole out（小分けに配る）", "word_key": "deal out", "word_def": "(句動) 配る、分配する。カードを配るイメージ。【類】hand out, distribute"}, {"id": 2166, "idiom": "delegate A to B", "meaning": "AをBに委ねる", "ex_en": "Mr. Smith will delegate his authority to Mr. Garcia.", "ex_ja": "スミス氏は彼の権限をガルシア氏に委ねるつもりだ。", "core": "権限・仕事を部下や他人に「委ねる・任せる」。マネジメント用語。", "syn": "entrust to（堅・委託）／ assign to（割り当て）／ hand over to（譲渡）", "word_key": "delegate", "word_def": "(動) 委任する／(名) 代表者。【類】entrust, assign。【関】delegation=代表団・委任"}, {"id": 2167, "idiom": "descend on", "meaning": "～に殺到する", "ex_en": "During the summer months, hordes of tourists descended on the little seaside resort.", "ex_ja": "夏の数か月間、その小さな海辺のリゾートに観光客が殺到した。", "core": "観光客・記者・批判が場所や人に「ドッと押し寄せる」。", "syn": "swarm（群がる）／ flock to（集まる）／ pour into（流れ込む）", "word_key": "descend", "word_def": "(動) 降りる／(光景・群衆が)押し寄せる。descend on=〜に殺到する。【関】descendant=子孫"}, {"id": 2168, "idiom": "dispense with", "meaning": "～を必要としない（= do without）", "ex_en": "The school decided to dispense with the services of the caretaker.", "ex_ja": "学校は管理人の仕事をなしで済ますことに決めた。", "core": "不要なものを「省く・なしで済ます」。形式ばった語。", "syn": "do without（口語）／ forgo（放棄）／ eliminate（除く）", "word_key": "dispense", "word_def": "(動) 分配する／(薬を)調剤する／(法律を)執行する。dispense with=〜なしで済ます"}, {"id": 2169, "idiom": "distract A from B", "meaning": "AをBから気を散らす", "ex_en": "She told her husband not to distract their son from his homework.", "ex_ja": "彼女は夫に、息子の宿題の邪魔をしないよう頼んだ。", "core": "注意・関心を本来のものから「逸らす」。子どもや勉強への気を散らす場面で頻出。", "syn": "divert from（堅）／ take one's mind off（気を紛らす）／ sidetrack（脱線させる）", "word_key": "distract", "word_def": "(動) 気を散らす、注意を逸らす。【類】divert, sidetrack。【関】distraction=気晴らし"}, {"id": 2170, "idiom": "dote on", "meaning": "～を溺愛する", "ex_en": "Both sets of grandparents doted on the new baby.", "ex_ja": "両家の祖父母とも、生まれたばかりの赤ん坊を溺愛した。", "core": "子ども・孫を「目に入れても痛くないほど可愛がる」。盲愛のニュアンス。", "syn": "adore（深く愛する）／ idolize（偶像化）／ spoil（甘やかす）", "word_key": "dote on", "word_def": "(句) 〜を溺愛する、目に入れても痛くないほど可愛がる。【類】adore, idolize"}, {"id": 2171, "idiom": "drag off", "meaning": "～を無理矢理に連行する", "ex_en": "The security men dragged off the intruder for questioning.", "ex_ja": "警備員たちは侵入者を尋問のため無理矢理連行した。", "core": "抵抗する人を物理的に引きずって連行する。警察・警備員の行為。", "syn": "haul off（引っ張る）／ cart off（連れ去る）／ hustle away（急いで連行）", "word_key": "drag off", "word_def": "(句動) 引きずって連れて行く、無理矢理連行する。【類】haul off, hustle away"}, {"id": 2172, "idiom": "drag on", "meaning": "（会議など）がだらだら長引く", "ex_en": "The lecture dragged on and the audience gradually became more and more restless.", "ex_ja": "講演はだらだらと続き、聴衆は次第に落ち着かなくなっていった。", "core": "会議・話・映画などが「だらだら長引く」。退屈さを伴う。", "syn": "drag out（引き延ばす）／ go on and on（延々と）／ wear on（時間が長く感じる）", "word_key": "drag on", "word_def": "(句動) だらだら長引く。【類】wear on, go on and on"}, {"id": 2173, "idiom": "draw in", "meaning": "～を勧誘する（= introduce）", "ex_en": "The man's job was to try and draw in new clients to the company.", "ex_ja": "その男性の仕事は、新たな顧客を会社に勧誘することだった。", "core": "客・人材を組織に引き込む。ビジネス・カルトなどに使う。", "syn": "attract（引きつける）／ recruit（採用）／ lure in（誘い込む・否定的）", "word_key": "draw in", "word_def": "(句動) (人を)引き込む、勧誘する。【類】attract, lure"}, {"id": 2174, "idiom": "drift off to sleep", "meaning": "うとうと眠り込む（= fall asleep）", "ex_en": "I was just drifting off to sleep when I was startled by a noise outside my window.", "ex_ja": "うとうとと眠りに落ちようとしていたところ、窓の外から聞こえた音に驚いた。", "core": "「いつの間にかうとうと」眠りに落ちる感覚。穏やかな入眠。", "syn": "doze off（うとうと）／ nod off（こっくり）／ fall asleep（一般）", "word_key": "drift", "word_def": "(動) 漂う、流される、ゆっくり移動する。drift off=うとうと眠る。【関】drifter=漂流者"}, {"id": 2175, "idiom": "drum up", "meaning": "（支持・取引など）を懸命に得ようとする", "ex_en": "He went from door to door trying to drum up support for his campaign against the new supermarket.", "ex_ja": "彼は、新しいスーパーマーケットへの反対運動の支持を集めるため、戸別訪問をした。", "core": "支持・関心・売上を懸命にかき集める。営業・運動の場面。", "syn": "stir up（かき立てる）／ generate（生み出す）／ rally（結集する）", "word_key": "drum up", "word_def": "(句動) (支持・客を) 太鼓を鳴らして集める→必死に得ようとする。【類】rally, generate"}, {"id": 2176, "idiom": "dwell on", "meaning": "～を強調する", "ex_en": "In his speech, the school principal dwelt on the need for students to prepare properly for classes.", "ex_ja": "校長はスピーチで、生徒が授業の準備を十分にすることの必要性を力説した。", "core": "過去の話・問題に「くどくどこだわる」。不健全に固執する含意も。", "syn": "harp on（くどい）／ fixate on（堅・執着）／ obsess over（取りつかれる）", "word_key": "dwell", "word_def": "(動) 住む／(問題に)こだわる、長く論じる。dwell on=～を強調する。【関】dweller=居住者"}, {"id": 2177, "idiom": "ease off", "meaning": "（雨などが）弱まる／緩む（= calm down）", "ex_en": "After a few hours, the typhoon began to ease off.", "ex_ja": "数時間後、台風は静まり始めた。", "core": "雨・痛み・需要・緊張が「徐々に弱まる」。", "syn": "let up（弱まる）／ subside（おさまる）／ die down（収まる）", "word_key": "ease off", "word_def": "(句動) 弱まる、緩む。ease=楽にする。【類】let up, subside, slacken"}, {"id": 2178, "idiom": "ease out", "meaning": "～を退け出す／追い出す", "ex_en": "The previous chairperson had been eased out before his bank had been taken over by a rival.", "ex_ja": "前会長は、自分の銀行が競合社に吸収される前にやんわり退かされていた。", "core": "組織から不要な人をやんわり退けて追い出す。穏便な解雇のニュアンス。", "syn": "push out（追い出す）／ oust（堅・追放）／ force out（強制退場）", "word_key": "ease out", "word_def": "(句動) (人を)穏便に追い出す。【類】push out, oust"}, {"id": 2179, "idiom": "egg ~ on", "meaning": "～をけしかける（= urge）", "ex_en": "His friends egged him on to steal the money from her purse.", "ex_ja": "彼の友達は、彼女の財布からお金を盗むよう彼をけしかけた。", "core": "そそのかして悪事や危険な行為をさせる。卵を投げつけるイメージから。", "syn": "urge（堅）／ goad（けしかける）／ incite（扇動する）／ provoke（挑発）", "word_key": "egg on", "word_def": "(句) (悪事を)けしかける。中英語のeggja=刺激する。【類】goad, incite, urge"}, {"id": 2180, "idiom": "eke out", "meaning": "（生計）をどうにか立てる（= make up for）", "ex_en": "For a few years, he eked out a living doing odd jobs.", "ex_ja": "数年間、彼はアルバイトをしてかろうじて生計を立てていた。", "core": "不十分なものでなんとか生計を立てる。やりくり感が強い。", "syn": "scrape by（かつかつ）／ get by on（やりくり）／ make ends meet（やっと暮らす）", "word_key": "eke", "word_def": "(動) eke out で (生活を)やっとのことで立てる、不足を補う。【類】scrape by, make do"}, {"id": 2181, "idiom": "face off", "meaning": "対決する（= face up to）", "ex_en": "The rival teams faced off in the championship finals.", "ex_ja": "ライバルチームは決勝戦で対決した。", "core": "試合・選挙などで「対戦・対決する」。スポーツ用語。", "syn": "square off（米・対決）／ go head to head（一対一）／ confront（堅）", "word_key": "face off", "word_def": "(句動) 対決する、にらみ合う。【類】square off, confront"}, {"id": 2182, "idiom": "factor in", "meaning": "～を計算に入れる（= take into consideration）", "ex_en": "After factoring in all the expenses, they decided the plan would not make a profit.", "ex_ja": "全ての経費を計算に入れた後、彼らはその計画では利益にならないと判断した。", "core": "計算・判断に「要素として含める」。経営・分析でよく使う。", "syn": "take into account（同義）／ allow for（考慮に入れる）／ include in（含める）", "word_key": "factor in", "word_def": "(句動) (要素を) 計算に入れる。factor=要因。【類】take into account, allow for"}, {"id": 2183, "idiom": "fade in", "meaning": "～を次第に明るくする", "ex_en": "The movie began by fading in a scene of the couple on a beach.", "ex_ja": "映画はカップルがビーチにいる場面のフェードインから始まった。", "core": "映画・写真の映像を「徐々に明るく・はっきり浮かび上がらせる」。映像用語。", "syn": "fade up（同義）／ dissolve in（移り変わる）", "word_key": "fade in", "word_def": "(句動) 徐々に明るくなる／音が大きくなる。映像用語。⇔ fade out"}, {"id": 2184, "idiom": "fall back on", "meaning": "（いざという時に）～に頼る", "ex_en": "Jim assured her that she could always fall back on him.", "ex_ja": "ジムは彼女に、いつでも自分に頼っていいと安心させた。", "core": "頼みの綱として「いざという時に頼る」。スペアプランのニュアンス。", "syn": "rely on（頼る）／ resort to（最終手段）／ have recourse to（堅）", "word_key": "fall back on", "word_def": "(句) (いざというとき) 〜に頼る、後ろ盾にする。【類】resort to, rely on"}, {"id": 2185, "idiom": "fall flat", "meaning": "失敗に終わる（= get nowhere）", "ex_en": "The advertising campaign fell flat when its star was arrested.", "ex_ja": "スターが逮捕されたために、その広告キャンペーンは失敗に終わった。", "core": "ジョーク・計画・公演が「全くウケない・スベる」。客観的な失敗。", "syn": "flop（失敗）／ bomb（米口語・大失敗）／ fall through（ご破算）", "word_key": "fall flat", "word_def": "(句動) ぺしゃんこに失敗する、ウケない。【類】flop, bomb"}, {"id": 2186, "idiom": "fall out with", "meaning": "～と仲たがいする（= disagree with）", "ex_en": "They were good friends but they fell out with each other in an argument over a girl.", "ex_ja": "2人は仲のいい友達だったが、1人の女性をめぐって言い争いをして仲たがいした。", "core": "親しい人と「仲違いして決別する」。喧嘩別れ。", "syn": "have a falling out（同義）／ quarrel with（喧嘩）／ break with（絶縁）", "word_key": "fall out with", "word_def": "(句) 〜と仲たがいする。fallout=放射性降下物／余波。【類】quarrel, break with"}, {"id": 2187, "idiom": "fall through", "meaning": "失敗に終わる（= fail）", "ex_en": "As long as the deal doesn't fall through at the last moment, the contract will be signed next Friday.", "ex_ja": "取引が最終段階で破綻しない限り、契約は来週の金曜日に締結されるだろう。", "core": "計画・取引が「途中で頓挫する」。最後の段階で崩れるイメージ。", "syn": "fall apart（崩れる）／ collapse（堅）／ break down（決裂）", "word_key": "fall through", "word_def": "(句動) (計画が) 立ち消えになる、頓挫する。【類】collapse, fall apart"}, {"id": 2188, "idiom": "fan out", "meaning": "四方八方に散らばる", "ex_en": "Volunteers fanned out over the countryside in their search for the missing girl.", "ex_ja": "ボランティアたちは行方不明の少女を探して、田舎中に散らばった。", "core": "捜索・配置などで人々が「四方に広がる」。軍隊・捜索隊の動き。", "syn": "spread out（広がる）／ disperse（堅）／ branch out（枝分かれ）", "word_key": "fan out", "word_def": "(句動) 扇形に広がる、四方に散らばる。fan=扇／ファン。【類】spread out, disperse"}, {"id": 2189, "idiom": "farm out", "meaning": "～を下請けに出す（= contract out）", "ex_en": "When he was busy, the translator farmed out work to his students.", "ex_ja": "その翻訳家は忙しい時、仕事を学生に下請けに出した。", "core": "仕事を「外注に出す」。下請けに依頼するビジネス用語。", "syn": "outsource to（外注）／ subcontract to（下請け）／ contract out（同義）", "word_key": "farm out", "word_def": "(句動) (仕事を) 下請けに出す、外注する。【類】outsource, subcontract"}, {"id": 2190, "idiom": "fend for oneself", "meaning": "自力で生きていく（= stand up for oneself）", "ex_en": "After her husband passed away, the widow had to fend for herself.", "ex_ja": "夫が亡くなった後、その未亡人は自力で生きていかねばならなかった。", "core": "親元を離れて「自力で生きる」。経済的自立のニュアンス。", "syn": "look after oneself（自分の世話）／ stand on one's own feet（独立）", "word_key": "fend", "word_def": "(動) (攻撃を) 防ぐ／(自分で) やりくりする。fend off=かわす／fend for oneself=自活"}, {"id": 2191, "idiom": "fend off", "meaning": "（質問など）をかわす", "ex_en": "The film star tried to fend off questions about his marriage by talking about his new movie.", "ex_ja": "その映画スターは、自分の新しい映画について話すことで、結婚に関する質問をかわそうとした。", "core": "質問・攻撃・批判を「うまくかわす」。剣で受け流すイメージ。", "syn": "ward off（防ぐ）／ deflect（堅・そらす）／ parry（受け流す）", "word_key": "fend off", "word_def": "(句) (質問・攻撃を) かわす。【類】ward off, parry, deflect"}, {"id": 2192, "idiom": "ferret out", "meaning": "～を見つけ出す", "ex_en": "They ferreted out a solution to sexism.", "ex_ja": "彼らは性差別問題に対する解決策を見つけ出した。", "core": "隠れた情報・原因を粘り強く嗅ぎ出す。フェレットのように。", "syn": "dig up（掘り出す）／ unearth（堅・発掘）／ root out（根絶＋発見）", "word_key": "ferret", "word_def": "(名) フェレット (動) 嗅ぎ出す。ferret out=隠れた物を見つける。【関】ferret-like=詮索好き"}, {"id": 2193, "idiom": "feud about", "meaning": "～を争う", "ex_en": "The two nations have been feuding about which of them owns the islands for decades.", "ex_ja": "両国は数十年もの間、それらの島の領有権をめぐって争ってきた。", "core": "家族・国家間で長期にわたり争い続ける。憎しみが世代を超える感じ。", "syn": "quarrel about（口論）／ bicker about（口げんか）／ wrangle over（堅・揉める）", "word_key": "feud", "word_def": "(名) 確執、宿怨 (動) いがみ合う。feud about=～をめぐって争う。【関】blood feud=血みどろの抗争"}, {"id": 2194, "idiom": "fill A in on B", "meaning": "AにBに関する情報を伝える", "ex_en": "Susie filled us in on the details of the meeting.", "ex_ja": "スージーは私たちに会議の詳細を伝えてくれた。", "core": "欠席者などに状況を「詳しく伝える」。情報の穴埋め。", "syn": "brief on（簡潔に伝える）／ update on（最新情報）／ catch up on（追いつかせる）", "word_key": "fill in on", "word_def": "(句) (人に状況を) 詳しく知らせる。穴を埋めるイメージ。【類】brief, update"}, {"id": 2195, "idiom": "firm up", "meaning": "～を確実なものにする（= ensure）", "ex_en": "They decided to firm up the arrangement by drawing up a contract.", "ex_ja": "彼らは契約書を取り交わすことで、取り決めを確実なものにすることにした。", "core": "計画・契約を「確定させる」。柔らかいものを固めるイメージ。", "syn": "finalize（堅・最終化）／ nail down（決定）／ confirm（確認）", "word_key": "firm up", "word_def": "(句動) (計画・契約を) 確実なものにする。【類】finalize, nail down, ensure"}, {"id": 2196, "idiom": "fizzle out", "meaning": "途中で失敗に終わる", "ex_en": "The protest eventually fizzled out after it began to rain heavily.", "ex_ja": "反対運動は大雨が降り始め、結局途中で失敗に終わった。", "core": "勢いのあったものが「尻すぼみに終わる」。炭酸が抜けるイメージ。", "syn": "peter out（消えていく）／ taper off（細り減）／ die out（途絶える）", "word_key": "fizzle", "word_def": "(動) しゅっと音を立てる→尻すぼみに終わる。fizzle out=立ち消える。【類】peter out, taper off"}, {"id": 2197, "idiom": "flare up (at)", "meaning": "（～に）むきになって怒る（= fly into a temper）", "ex_en": "Sometimes her boss flared up at her for no clear reason.", "ex_ja": "彼女の上司は、時折はっきりした理由もなく彼女に対してむきになって怒った。", "core": "怒りや怒鳴り声が突然激しく爆発する。火が燃え上がるイメージ。", "syn": "blow up（爆発）／ explode（堅）／ lose one's temper（キレる）", "word_key": "flare", "word_def": "(名) 炎、信号弾 (動) 燃え上がる／(感情が)爆発する。flare up=突然怒る。【関】solar flare=太陽フレア"}, {"id": 2198, "idiom": "flash back to", "meaning": "～を急に思い出す", "ex_en": "As he entered the campus, he flashed back to his own student days.", "ex_ja": "キャンパスに足を踏み入れた瞬間、彼は自分の学生時代を急に思い出した。", "core": "過去の場面・記憶が突然「蘇る」。映画用語から。", "syn": "be reminded of（思い出す）／ recall（堅）／ have a flashback（同根）", "word_key": "flash back", "word_def": "(句動) (記憶が) 突然蘇る。映画の手法から。【関】flashback=回想シーン"}, {"id": 2199, "idiom": "flesh out", "meaning": "～を肉付けする", "ex_en": "His boss told him to flesh out his idea a bit and then bring it back for further consideration.", "ex_ja": "上司は彼に、再考のためにアイデアをもう少し肉付けして再提出するように伝えた。", "core": "骨組みだけのアイデアに肉付けして詳しく描く。", "syn": "develop（堅・展開）／ expand on（広げる）／ elaborate on（詳述）", "word_key": "flesh out", "word_def": "(句動) (骨組みに) 肉付けする、詳細を加える。【類】elaborate, develop, expand"}, {"id": 2200, "idiom": "flip out", "meaning": "カッとなる／ひどく興奮する", "ex_en": "When he found out he was going to be fired, he flipped out completely.", "ex_ja": "解雇されると分かった時、彼は完全にカッとなった。", "core": "怒り・パニックで自制を失う。「ブチ切れる」感覚。", "syn": "freak out（米俗）／ go ballistic（激怒）／ blow a fuse（米口語）", "word_key": "flip out", "word_def": "(句動) 急にキレる、取り乱す。【類】freak out, lose it, blow up"}, {"id": 2201, "idiom": "float around", "meaning": "（考え・うわさが）広まる（= get about, gain ground）", "ex_en": "The idea had been floating around for some time before it was discussed.", "ex_ja": "そのアイデアは、議論される前にしばらくあちこちで広まっていた。", "core": "噂・アイデアが「あちこちに漂う・広まる」。風船のイメージ。", "syn": "circulate（堅）／ go around（出回る）／ make the rounds（巡る）", "word_key": "float around", "word_def": "(句) (噂・案が) ぼんやり広まる。【類】circulate, get about, make the rounds"}, {"id": 2202, "idiom": "flood in", "meaning": "殺到する（= pour in）", "ex_en": "Invitations for the singer to appear on stage flooded in from TV companies.", "ex_ja": "その歌手のステージ出演依頼が、テレビ局から殺到した。", "core": "手紙・問い合わせ・避難民が「殺到する」。洪水のように押し寄せる。", "syn": "pour in（流れ込む）／ stream in（堅）／ inundate（堅・水浸し）", "word_key": "flood in", "word_def": "(句動) どっと押し寄せる。flood=洪水。【類】pour in, stream in"}, {"id": 2203, "idiom": "fly off the handle", "meaning": "カッとなる（= hit the roof）", "ex_en": "Ms. Swain flew off the handle when Cal didn't behave.", "ex_ja": "キャルが行儀悪くしたので、スウェイン先生はカッとなった。", "core": "ささいなことで急にカッとなる。ハンドルから手が離れて制御不能なイメージ。", "syn": "lose one's temper（キレる）／ blow up（爆発）／ flip out（取り乱す）", "word_key": "fly off the handle", "word_def": "(句) 突然キレる。斧の頭が柄から外れて飛ぶ様から。【類】lose it, hit the roof"}, {"id": 2204, "idiom": "follow through", "meaning": "～を最後までやり通す", "ex_en": "Unfortunately, he failed to follow through on his original offer.", "ex_ja": "残念ながら、彼は当初の提案を最後までやり通すことができなかった。", "core": "約束・計画を「最後までやり抜く」。中途半端で終わらせない。", "syn": "see through（最後まで）／ carry out（実行）／ complete（堅・完了）", "word_key": "follow through", "word_def": "(句動) 最後までやり抜く。スポーツのフォロースルーから。【類】see through, complete"}, {"id": 2205, "idiom": "foreclose on", "meaning": "～に担保権を行使する", "ex_en": "When the couple fell behind with their payments, their bank foreclosed on the loan and seized their property.", "ex_ja": "その夫婦の支払いが滞ると、銀行は担保権を行使して彼らの財産を差し押さえた。", "core": "ローン未払いで銀行が担保物件を「差し押さえる」。金融用語。", "syn": "repossess（再取得）／ seize（差し押さえる）／ take possession of（堅）", "word_key": "foreclose", "word_def": "(動) 担保権を行使して差し押さえる／予防する。【関】foreclosure=抵当物件の差し押さえ"}, {"id": 2206, "idiom": "fork out", "meaning": "～を渋々払う", "ex_en": "He resented forking out money for his son's graduate studies.", "ex_ja": "彼は息子の大学院の学費を渋々払うのを苦々しく思った。", "core": "高額な金を「しぶしぶ払う」。痛みを伴う支払い。", "syn": "shell out（同義）／ cough up（口語・吐き出す）／ stump up（英・出し渋る）", "word_key": "fork out", "word_def": "(句動) 渋々支払う。フォークで突き出すイメージ。【類】shell out, cough up"}, {"id": 2207, "idiom": "freeze up", "meaning": "（大変な状況下で）固まる", "ex_en": "When he got up to speak, he suddenly froze up and stood there silently.", "ex_ja": "話すために起立した時、彼は突然頭が真っ白になり、無言で立ち尽くした。", "core": "プレッシャーで「頭が真っ白になり固まる」。スピーチや試験で頻出。", "syn": "go blank（頭が真っ白）／ choke（土壇場で失敗）／ clam up（黙り込む）", "word_key": "freeze up", "word_def": "(句動) (緊張で) 動きが止まる、固まる。【類】lock up, choke"}, {"id": 2208, "idiom": "fritter away", "meaning": "～を無駄遣いする（= waste, squander）", "ex_en": "Diana got a part time job with the aim of saving money, but she frittered away most of her earnings on cosmetics and magazines.", "ex_ja": "ダイアナは貯金しようとアルバイトを始めたが、稼ぎのほとんどを化粧品や雑誌に浪費した。", "core": "時間・お金・才能を「ちびちび無駄遣いする」。少しずつ浪費。", "syn": "squander（堅・浪費）／ waste away（無駄にする）／ blow（一気に使う・口語）", "word_key": "fritter away", "word_def": "(句) (時間・お金を) 少しずつ無駄遣いする。【類】squander, waste, blow"}, {"id": 2209, "idiom": "gain on", "meaning": "～に追いつく（= catch up with）", "ex_en": "The new company rapidly began to gain on its rivals in the field.", "ex_ja": "その新しい会社は、業界のライバルたちに急速に追いつき始めた。", "core": "競争相手に「徐々に追いつく」。距離が縮まる感覚。", "syn": "catch up with（追いつく）／ close in on（迫る）／ narrow the gap（差を縮める）", "word_key": "gain on", "word_def": "(句) 〜に追いつく、距離を縮める。【類】catch up with, close in on"}, {"id": 2210, "idiom": "gang up on", "meaning": "～に集団で襲い掛かる", "ex_en": "The girl complained that her classmates were always ganging up on her.", "ex_ja": "少女は、級友たちがいつも自分に集団で襲い掛かってくると不満を漏らした。", "core": "複数で1人を「集団でいじめる・襲う」。学校でのいじめにも。", "syn": "pick on（標的にする）／ pile on（堆く掛かる）／ team up against（連合する）", "word_key": "gang up on", "word_def": "(句) 集団でいじめる、寄ってたかって攻撃する。【関】gang=ギャング・集団"}, {"id": 2211, "idiom": "get A across to B", "meaning": "AをBに理解させる", "ex_en": "How can I get my point across to them?", "ex_ja": "自分の主張を彼らにどう理解させればよいのだろう？", "core": "自分の意図・主張を相手に「うまく伝えて理解させる」。", "syn": "communicate to（堅）／ convey to（伝達）／ put across to（同義）", "word_key": "get across", "word_def": "(句動) (考えを) 伝える、わからせる。【類】communicate, convey, put across"}, {"id": 2212, "idiom": "glance off", "meaning": "～を弾き飛ばす（= hit indirectly）", "ex_en": "The bullet glanced off a rock and wounded him in the arm.", "ex_ja": "弾丸は岩を弾き飛ばし、彼の腕に傷を負わせた。", "core": "弾・光・批判が「斜めにそれてはじけ飛ぶ」。直撃を逃れるイメージ。", "syn": "ricochet off（跳弾）／ deflect off（そらす）／ bounce off（はね返る）", "word_key": "glance off", "word_def": "(句動) (弾・光が) かすめて跳ね返る。glance=ちらりと見る／かすめる。【類】ricochet, deflect"}, {"id": 2213, "idiom": "gloss over", "meaning": "～をごまかす", "ex_en": "You can't just gloss over his poor performance.", "ex_ja": "君は彼の業績不振をごまかすことはできない。", "core": "不都合・失敗を「軽く流して隠す」。表面を撫でて誤魔化すイメージ。", "syn": "downplay（軽視する）／ paper over（取り繕う）／ brush over（流す）", "word_key": "gloss over", "word_def": "(句動) 上辺を取り繕う、軽く流す。gloss=艶／注釈。【類】downplay, paper over"}, {"id": 2214, "idiom": "grope for", "meaning": "～を手探りで探す", "ex_en": "He groped for the appropriate words to use to tell her what he felt.", "ex_ja": "彼は自分の気持ちを彼女に伝えるための適切な言葉を手探りで探した。", "core": "暗闇・記憶などを「手探りで探す」。物理・比喩両方。", "syn": "fumble for（不器用に）／ feel for（手探り）／ search for（探す）", "word_key": "grope", "word_def": "(動) 手探りで探す／(俗)体を触る。【類】fumble, feel for。【関】grope for words=言葉に詰まる"}, {"id": 2215, "idiom": "hail A as B", "meaning": "AをBとして迎え入れる", "ex_en": "Many people hailed the prime minister as the savior of the country.", "ex_ja": "多くの人が首相をその国の救世主として迎え入れた。", "core": "人を救世主・英雄として大々的に称える。報道・歴史で頻出。", "syn": "acclaim as（堅・称賛）／ praise as（褒める）／ proclaim as（宣言）", "word_key": "hail", "word_def": "(動) 〜と称える／(タクシーを)呼び止める／挨拶する。【関】hail from=～の出身"}, {"id": 2216, "idiom": "hammer out", "meaning": "～を交渉で決める", "ex_en": "It took the diplomats months to hammer out the precise wording of the new treaty.", "ex_ja": "外交官たちは新条約の文言を交渉で決めるのに数か月を要した。", "core": "交渉・議論で「叩き出して結論を出す」。鍛冶屋のイメージ。", "syn": "thrash out（議論し尽くす）／ work out（解決）／ negotiate（交渉）", "word_key": "hammer out", "word_def": "(句動) (合意を) 叩き出す、苦心して決める。【類】thrash out, work out"}, {"id": 2217, "idiom": "hang out in", "meaning": "～でぶらぶらして時を過ごす", "ex_en": "The local youngsters would hang out in the cafe on weekends.", "ex_ja": "地元の若者たちは週末にカフェでぶらぶらして時を過ごしていた。", "core": "特定の場所で「だらだら時間を過ごす」。10代の若者の口語。", "syn": "loiter in（堅・うろつく）／ chill at（米若者語）／ kill time at（暇つぶし）", "word_key": "hang out", "word_def": "(句動) ぶらぶら時間を過ごす／(人と)つるむ。【関】hangout=たまり場"}, {"id": 2218, "idiom": "harp on", "meaning": "～について繰り返し話す", "ex_en": "She hated the way her husband harped on money all the time.", "ex_ja": "彼女は夫がお金についてくどくど話すのが大嫌いだった。", "core": "同じ話題を「くどくど繰り返す」。聞き手にうんざり感を与える。", "syn": "go on about（くどい）／ dwell on（こだわる）／ keep harping on（同義）", "word_key": "harp", "word_def": "(名) ハープ (動) しつこく繰り返す。harp on=くどくど話す。【類】go on about"}, {"id": 2219, "idiom": "have it out with", "meaning": "～と議論して決着をつける", "ex_en": "Peggy was not ready to have it out with Jim.", "ex_ja": "ペギーはまだ、ジムと議論して決着をつける心の準備ができていなかった。", "core": "ためてきた不満を「ぶつけてケリをつける」。腹を割って話す。", "syn": "thrash out（議論で解決）／ confront（堅・対決）／ sort out with（収拾）", "word_key": "have it out with", "word_def": "(句) 〜と決着をつけるまで議論する。【類】confront, thrash out"}, {"id": 2220, "idiom": "head off", "meaning": "～を阻止する（= prevent）", "ex_en": "The company president said that he was confident that they would be able to head off the threat from their new rivals.", "ex_ja": "その会社の社長は、新規競合社からの脅威を阻止できると自信を持って語った。", "core": "脅威・問題が起こる前に「先回りして阻止する」。", "syn": "prevent（防ぐ）／ avert（堅・回避）／ ward off（撃退）", "word_key": "head off", "word_def": "(句動) 先回りして阻止する。【類】prevent, avert, ward off"}, {"id": 2221, "idiom": "hem in", "meaning": "～を囲む", "ex_en": "After hemming in the enemy, the army attacked them at dawn.", "ex_ja": "敵を取り囲んだ後、軍は夜明けに攻撃を開始した。", "core": "敵や物体を「四方から取り囲む」。軍事・スポーツで頻出。", "syn": "surround（一般）／ encircle（堅）／ box in（囲い込む）", "word_key": "hem in", "word_def": "(句動) 取り囲む、閉じ込める。hem=縁取り、衣服のすそ。【類】surround, encircle"}, {"id": 2222, "idiom": "hike up", "meaning": "～を引き上げる", "ex_en": "The government decided to raise revenue by hiking up the tax on cigarettes.", "ex_ja": "政府はタバコ税を引き上げることで、歳入を増やすことに決めた。", "core": "税金・価格・賃金を「ぐっと引き上げる」。", "syn": "raise（一般）／ jack up（強引に）／ push up（押し上げる）", "word_key": "hike", "word_def": "(動) ハイキングする／(値段を) 引き上げる。hike up=値上げする。【類】jack up, raise"}, {"id": 2223, "idiom": "hinge on", "meaning": "～次第である（= depend on）", "ex_en": "The team's chance of victory hinged on the performance of its star players.", "ex_ja": "そのチームの勝利の可能性は、スター選手の活躍次第だった。", "core": "成否・結果が「～次第である」。蝶番（ヒンジ）が支点のイメージ。", "syn": "depend on（同義）／ rest on（基づく）／ be contingent on（堅・条件付き）", "word_key": "hinge", "word_def": "(名) 蝶番 (動) (hinge on で) 〜に左右される。【類】depend on, rest on"}, {"id": 2224, "idiom": "hit it off with", "meaning": "～と馬が合う（= get along with）", "ex_en": "Susie hit it off well with her mother-in-law.", "ex_ja": "スージーは姑とよく馬が合った。", "core": "初対面ですぐ「意気投合する」。打ち解けるニュアンス。", "syn": "get along with（仲良くなる）／ click with（口語・気が合う）／ bond with（絆を築く）", "word_key": "hit it off", "word_def": "(句) 意気投合する。【類】get along, click, gel"}, {"id": 2225, "idiom": "hit the roof", "meaning": "激怒する", "ex_en": "When she told her father about the accident, he hit the roof.", "ex_ja": "彼女が父親に事故について話した時、父親は激怒した。", "core": "怒りで天井を突き抜けるほど「激怒する」。", "syn": "fly off the handle（カッとなる）／ blow up（爆発）／ go ballistic（激昂）", "word_key": "hit the roof", "word_def": "(句) 激怒する、屋根を突き抜けるほど怒る。【類】hit the ceiling, fly off the handle"}, {"id": 2226, "idiom": "hold down", "meaning": "（職・地位など）に就いている", "ex_en": "Charlie held down a good job at a high salary.", "ex_ja": "チャーリーは高給のいい仕事に就いていた。", "core": "仕事・地位を「保ち続ける」。保持し続ける継続性が焦点。", "syn": "keep（保つ）／ maintain（堅・維持）／ retain（堅・確保）", "word_key": "hold down", "word_def": "(句動) (職に) 留まる／(声を) 抑える。【類】keep, retain, maintain"}, {"id": 2227, "idiom": "hold out for", "meaning": "～を要求して譲らない", "ex_en": "The workers decided to hold out for a better offer from management.", "ex_ja": "労働者たちは、経営側からより良い提案が出るまで譲らないことを決めた。", "core": "交渉でより良い条件が出るまで「譲らず粘る」。", "syn": "stand firm（屈しない）／ insist on（要求）／ stick out for（粘り強く）", "word_key": "hold out for", "word_def": "(句) (より良い条件を) 求めて譲らない。【類】stand firm, insist on"}, {"id": 2228, "idiom": "hold over", "meaning": "～を延期する（= carry over）", "ex_en": "Because of the bad weather, the sports meet was held over for a week.", "ex_ja": "悪天候のため、運動会は1週間延期された。", "core": "予定を後日に「持ち越す」。延期だが完全に流れたわけではない。", "syn": "carry over（同義）／ postpone（延期）／ defer（堅）", "word_key": "hold over", "word_def": "(句動) 持ち越す、延期する。【類】postpone, carry over, defer"}, {"id": 2229, "idiom": "hole up", "meaning": "隠れる", "ex_en": "The escaped convicts holed up in a remote farmhouse.", "ex_ja": "脱獄囚たちは、人里離れた農家に身を潜めた。", "core": "逃亡者が「身を潜める」。特定の場所に隠れる感覚。", "syn": "hide out（同義）／ lay low（口語・潜伏）／ take refuge in（避難）", "word_key": "hole up", "word_def": "(句動) (穴に潜むように) 隠れる。【類】hide out, lay low"}, {"id": 2230, "idiom": "horse around", "meaning": "ばか騒ぎをする", "ex_en": "The teacher came in to find the students horsing around.", "ex_ja": "先生が入ってくると、生徒たちがばか騒ぎしているのを見つけた。", "core": "子どもがふざけて騒ぐ。乱暴・はしゃぐイメージ。", "syn": "fool around（ふざける）／ mess around（無秩序）／ goof off（仕事をサボる）", "word_key": "horse around", "word_def": "(句動) ばか騒ぎする、ふざける。【類】fool around, mess around"}, {"id": 2231, "idiom": "huddle with", "meaning": "～と相談する", "ex_en": "During the break, the team huddled with their coach to discuss tactics.", "ex_ja": "ハーフタイム中、チームは戦略を相談すべくコーチと話し合った。", "core": "チームが寄り集まって作戦会議する。物理的に頭を寄せ合う。", "syn": "huddle together（寄り集まる）／ gather with（堅）／ confer with（協議）", "word_key": "huddle", "word_def": "(動) 寄り集まる、身を寄せる。【類】gather, cluster。【関】huddle=作戦会議"}, {"id": 2232, "idiom": "hunker down", "meaning": "身を潜める", "ex_en": "Most residents hunkered down in their homes until the storm passed.", "ex_ja": "ほとんどの住民は、嵐が過ぎ去るまで家に身を潜めた。", "core": "嵐・困難に備え身を低くする。じっと耐える長期戦のニュアンス。", "syn": "hunker（屈む）／ hole up（潜む）／ ride out（乗り切る）", "word_key": "hunker down", "word_def": "(句動) しゃがみ込む／じっと耐える。【類】crouch, hole up, ride out"}, {"id": 2233, "idiom": "identify with", "meaning": "～に共感する（= sympathize with）", "ex_en": "Mary felt she could identify with the heroine of the novel as their experiences were so remarkably similar.", "ex_ja": "経験があまりにも似ていたので、メアリーは小説のヒロインに共感することができた。", "core": "登場人物・経験談に「自分を重ねて共感する」。", "syn": "sympathize with（同情）／ empathize with（堅・共感）／ relate to（口語・分かる）", "word_key": "identify with", "word_def": "(句) 〜に共感する、自分と重ねる。【類】sympathize, empathize, relate to"}, {"id": 2234, "idiom": "impose on", "meaning": "～を押し付ける／～にプライバシーに干渉する", "ex_en": "I'm sorry to impose on you at home, but tomorrow's meeting with you privately I really need to discuss.", "ex_ja": "家までお邪魔して申し訳ないが、明日のミーティングで内密に話したいことがある。", "core": "迷惑をかけて時間や場所を奪う。「お邪魔する」の改まった言い方。", "syn": "intrude on（侵入）／ trouble（迷惑をかける）／ inconvenience（堅）", "word_key": "impose", "word_def": "(動) (税・規則を) 課す／(招かれず) 押しかける。impose on=～に迷惑をかける／に強要する"}, {"id": 2235, "idiom": "intercede with", "meaning": "～に取り成す", "ex_en": "The group asked the politician to intercede with the government.", "ex_ja": "そのグループは、政府に取り成してくれるよう政治家に頼んだ。", "core": "第三者として両者の間に入って「とりなす」。仲裁する。", "syn": "mediate（堅・仲裁）／ intervene（介入）／ step in for（代弁）", "word_key": "intercede", "word_def": "(動) 仲裁する、執り成す。【類】mediate, intervene。【関】intercession=取り成し"}, {"id": 2236, "idiom": "interfere with", "meaning": "～を妨げる（= interrupt）", "ex_en": "The noise from the traffic outside interfered with his concentration, making it difficult for him to study.", "ex_ja": "外の交通騒音が彼の集中力を妨げ、勉強しづらくしていた。", "core": "勉強・睡眠・進行を「邪魔する・妨げる」。否定的な影響。", "syn": "interrupt（中断）／ disrupt（堅・混乱）／ hamper（邪魔）", "word_key": "interfere", "word_def": "(動) 邪魔する、干渉する。interfere with=～を妨げる。【関】interference=干渉"}, {"id": 2237, "idiom": "iron out", "meaning": "～を解決する（= solve, resolve）", "ex_en": "The computer engineer spent the weekend ironing out various bugs in the new program.", "ex_ja": "そのコンピューターエンジニアは週末を費やして、新プログラムの様々なバグを解決した。", "core": "問題点・しわを「アイロンで伸ばすように解決する」。", "syn": "resolve（堅）／ smooth out（円滑に）／ work out（解決する）", "word_key": "iron out", "word_def": "(句動) アイロンでしわを伸ばすように問題を解決する。【類】resolve, smooth out"}, {"id": 2238, "idiom": "jack up", "meaning": "（値段）を引き上げる", "ex_en": "Supermarkets took advantage of the paper shortage to jack up the prices of all paper products.", "ex_ja": "スーパーは紙不足に乗じて、すべての紙製品の値段を引き上げた。", "core": "値段を不当に・大幅に引き上げる。便乗値上げのニュアンス。", "syn": "hike up（引き上げる）／ inflate（堅・水増し）／ ramp up（増強）", "word_key": "jack up", "word_def": "(句動) ジャッキで持ち上げる→値段を上げる。【類】hike up, raise"}, {"id": 2239, "idiom": "keep after", "meaning": "～に催促し続ける", "ex_en": "His wife kept after him until he finally agreed to fix the broken window.", "ex_ja": "彼の妻は、壊れた窓を直すと夫がついに約束するまで催促し続けた。", "core": "宿題や約束を実行するよう「ガミガミ言い続ける」。", "syn": "nag（しつこく言う）／ pester（うるさく）／ press（圧力をかける）", "word_key": "keep after", "word_def": "(句) 〜に催促し続ける。【類】nag, pester, press"}, {"id": 2240, "idiom": "kick up", "meaning": "（騒ぎなど）を引き起こす／（ほこりなど）を上げる", "ex_en": "The customer kicked up a fuss about his cutlery, saying that it had not been properly washed.", "ex_ja": "その客は食器について「ちゃんと洗われていない」と苦情を引き起こした。", "core": "ほこり・騒ぎ・反応を「巻き起こす」。蹴散らかすイメージ。", "syn": "stir up（かき立てる）／ raise（騒ぎを起こす）／ cause a fuss（騒動）", "word_key": "kick up", "word_def": "(句動) 騒ぎ・埃を巻き起こす。【類】stir up, raise, cause"}, {"id": 2241, "idiom": "knuckle down", "meaning": "真剣に取り組む（= adopt a serious stance）", "ex_en": "She told her daughter to knuckle down and write her science report.", "ex_ja": "彼女は娘に、真剣に取り組んで理科のレポートを書くように言った。", "core": "怠けていたのを止めて「真剣に勉強・仕事に取り組む」。", "syn": "buckle down（同義）／ get serious about（本気）／ apply oneself（励む）", "word_key": "knuckle", "word_def": "(名) 指関節 (動) 拳でこする。knuckle down=真剣に取り組む／knuckle under=屈する"}, {"id": 2242, "idiom": "knuckle under", "meaning": "屈服する（= give in）", "ex_en": "Finally, their lazy son knuckled under and got a job.", "ex_ja": "とうとう、その怠け者の息子は屈服して仕事に就いた。", "core": "圧力に屈して「諦めて従う」。プライドを折って降参する感じ。", "syn": "give in（屈する）／ cave in（崩れて従う）／ surrender（堅・降伏）", "word_key": "knuckle under", "word_def": "(句) 屈服する。指の関節を下げる→敗北のしぐさ。【類】give in, submit"}, {"id": 2243, "idiom": "lag behind", "meaning": "～に遅れを取る", "ex_en": "For most of the race, he was lagging behind the other competitors, but then in the last few minutes, he made a supreme effort and came in first.", "ex_ja": "レースの大半で他選手に遅れを取っていたが、最後の数分で全力を出し1位でゴールした。", "core": "競争で「他より遅れる」。物理的・抽象的距離。", "syn": "fall behind（同義）／ trail（後を追う）／ be left behind（取り残される）", "word_key": "lag", "word_def": "(動) 遅れる、ぐずぐずする。【類】trail, fall behind。【関】lag time=時間差・遅延"}, {"id": 2244, "idiom": "lash out at", "meaning": "～を激烈に非難する", "ex_en": "The president lashed out at critics, saying they were in the pay of a foreign government.", "ex_ja": "大統領は批判者に対し、外国政府に買収されていると激しく非難した。", "core": "批判者・敵・状況を「猛烈に攻撃する」。言葉で殴りかかる。", "syn": "rail against（堅）／ attack（攻撃）／ rip into（口語・激しく非難）", "word_key": "lash", "word_def": "(動) 鞭打つ、激しく非難する／(波が)激しく打ちつける。lash out at=猛烈に攻撃する"}, {"id": 2245, "idiom": "launch into", "meaning": "～を始める（= start, begin）", "ex_en": "Please don't ask him about work or he'll launch into a detailed description of all the problems the business is facing.", "ex_ja": "仕事のことを彼に尋ねないで、さもないと事業の問題を事細かに説明し始めるから。", "core": "演説・話・冒険などを勢いよく「始める」。", "syn": "embark on（堅・着手）／ plunge into（飛び込む）／ jump into（口語）", "word_key": "launch into", "word_def": "(句動) (話を) 勢いよく始める／攻撃する。launch=発射・開始。【類】embark on, plunge into"}, {"id": 2246, "idiom": "lay it on thick", "meaning": "大げさに言う", "ex_en": "He laid it on thick when he told his boss his excuse for being late.", "ex_ja": "彼は遅刻の理由を上司に説明するとき、大げさに言った。", "core": "褒め言葉・嘘・言い訳を「大げさに盛る」。", "syn": "exaggerate（誇張）／ overdo it（やり過ぎる）／ pile it on（口語）", "word_key": "lay it on thick", "word_def": "(句) 大げさに言う、お世辞を盛る。【類】exaggerate, pile it on"}, {"id": 2247, "idiom": "leaf through", "meaning": "～をぱらぱらめくって目を通す", "ex_en": "While she waited, she leafed through the magazines on the table.", "ex_ja": "彼女は待っている間、テーブルの上の雑誌をぱらぱらめくって目を通した。", "core": "本・雑誌・書類を急いで「ぱらぱらめくる」。browse through より速い。", "syn": "flip through（さっとめくる）／ skim through（拾い読み）／ thumb through（指で）", "word_key": "leaf through", "word_def": "(句動) (本を) ぱらぱらめくる。leaf=葉／(本の)ページ。【類】flip through, skim"}, {"id": 2248, "idiom": "lean on", "meaning": "～に圧力をかける（= put pressure on）", "ex_en": "The mayor failed to lean on the editor to spike the story.", "ex_ja": "市長は記事を抑えるため編集者に圧力をかけたが、失敗した。", "core": "権力・体重・人を物理的または比喩的に「もたれかかる／圧力をかける」。", "syn": "pressure（堅・圧力）／ pressurize（英）／ put pressure on（同義）", "word_key": "lean on", "word_def": "(句動) もたれかかる／圧力をかける。【類】pressure, put pressure on"}, {"id": 2249, "idiom": "let down", "meaning": "～を失望させる（= disappoint）", "ex_en": "Everybody felt let down when their team failed to win the final.", "ex_ja": "自分のチームが決勝で勝てなかった時、皆が失望した。", "core": "約束・期待を「裏切って失望させる」。", "syn": "disappoint（堅・失望）／ fail（失敗する）／ leave hanging（宙ぶらりん）", "word_key": "let down", "word_def": "(句動) (期待を) 裏切る、失望させる／(髪を) 下ろす。【類】disappoint, fail"}, {"id": 2250, "idiom": "level off", "meaning": "横ばいになる", "ex_en": "Finally, the rise in the value of the dollar began to level off.", "ex_ja": "とうとう、ドルの価値の上昇は横ばいになり始めた。", "core": "増減してきたものが「平らになる・落ち着く」。グラフが横ばい。", "syn": "plateau（堅・横ばい）／ stabilize（安定）／ flatten out（平らになる）", "word_key": "level off", "word_def": "(句動) (上下動が) 平らになる、横ばいになる。【類】plateau, stabilize, flatten out"}, {"id": 2251, "idiom": "level with", "meaning": "～に正直に話をする", "ex_en": "I'll level with you. If your play doesn't improve, I'll take you off the team.", "ex_ja": "正直に話そう。プレーが改善しないなら、チームから外す。", "core": "正直に・包み隠さず話す。改まった「率直に」のニュアンス。", "syn": "be straight with（口語・率直）／ be honest with（正直に）／ come clean with（白状）", "word_key": "level with", "word_def": "(句) 〜に正直に話す、率直に打ち明ける。【類】be straight with, come clean"}, {"id": 2252, "idiom": "live down", "meaning": "（失敗）を人にすっかり忘れさせる", "ex_en": "He never lived down his failure to secure the deal and eventually he left the company for another one.", "ex_ja": "彼は商談を成立させられなかった失敗を人々の記憶から消すことができず、結局別の会社に移った。", "core": "過去の不名誉・失敗を時間をかけて「忘れさせる」。否定形が多い。", "syn": "live ~ down（=同義）／ overcome（克服）／ get over（乗り越える）", "word_key": "live down", "word_def": "(句動) (失敗を時間で) 忘れさせる。否定形が多い。【関】live up to=期待に応える"}, {"id": 2253, "idiom": "lop off", "meaning": "～を切り取る（= trim off）", "ex_en": "He took out a knife and lopped off a bunch of bananas from the tree.", "ex_ja": "彼はナイフを取り出して、木からバナナを切り取った。", "core": "枝・小指などを「切り落とす」。物理的にスパッと。", "syn": "chop off（切り取る）／ cut off（断ち切る）／ trim off（剪定する）", "word_key": "lop", "word_def": "(動) (枝などを) 切り落とす。lop off=切り落とす。【類】chop off, sever"}, {"id": 2254, "idiom": "make off with", "meaning": "～を盗み去る（= steal）", "ex_en": "During the bomb scare at the museum, a thief made off with a valuable painting.", "ex_ja": "美術館の爆弾予告による混乱に乗じて、泥棒が貴重な絵画を盗み去った。", "core": "貴重品をこっそり「持ち去る・盗み逃げする」。", "syn": "steal（盗む）／ run off with（持ち逃げ）／ abscond with（堅・横領逃亡）", "word_key": "make off with", "word_def": "(句) (品物を) 持ち逃げする。【類】run off with, abscond with, steal"}, {"id": 2255, "idiom": "mark down", "meaning": "～を値下げする（= lower the price）", "ex_en": "The store decided to mark down their prices by 50 percent.", "ex_ja": "その店は値段を50%値下げすることを決定した。", "core": "商品の値段を「値下げする」。セール用語。", "syn": "discount（割引）／ reduce（堅）／ slash（大幅値下げ・口語）", "word_key": "mark down", "word_def": "(句動) 値下げする／書き留める／減点する。⇔ mark up。【類】discount, slash"}, {"id": 2256, "idiom": "mark out", "meaning": "～を区分する", "ex_en": "He marked out on a map the area they would patrol.", "ex_ja": "彼は、地図上でパトロールする地域を区分した。", "core": "地図・地面に「区切って印をつける」。範囲を示す。", "syn": "designate（堅・指定）／ map out（マップ化）／ define（定義する）", "word_key": "mark out", "word_def": "(句動) (区域を) 線引きする、区分する。【類】designate, define, map out"}, {"id": 2257, "idiom": "mark up", "meaning": "～を値上げする", "ex_en": "Most shops make a profit by marking up the prices of goods they buy from wholesalers.", "ex_ja": "ほとんどの店は、問屋から仕入れた商品の値段を上げて利益を得る。", "core": "商品を仕入れ値より高く「値段を上げて売る」。", "syn": "inflate（堅）／ raise the price of（値上げ）／ jack up（強引に上げる）", "word_key": "mark up", "word_def": "(句動) 値上げする。仕入れ値に利益を上乗せ。【関】markup=利益幅"}, {"id": 2258, "idiom": "measure out", "meaning": "～を量り分ける", "ex_en": "The chemist measured out a small amount of the new drug.", "ex_ja": "薬剤師は新薬を少量量り分けた。", "core": "液体・粉末を「正確な量に量り分ける」。", "syn": "portion out（分量を分ける）／ dispense（堅・調剤）／ allot（割り当て）", "word_key": "measure out", "word_def": "(句動) (一定量を) 量り分ける。【類】portion out, dispense"}, {"id": 2259, "idiom": "measure up to", "meaning": "（基準など）に達する", "ex_en": "Jane was pleased that she had been promoted, but she was worried that she would not measure up to her new duties.", "ex_ja": "ジェーンは昇進してうれしかったが、新しい職務の水準に達しないのではと心配していた。", "core": "期待・基準・前任者の水準に「達する」。否定形が多い。", "syn": "live up to（期待に応える）／ meet（堅・満たす）／ be up to（標準に達する）", "word_key": "measure up to", "word_def": "(句) (基準・期待に) 達する。【類】live up to, meet, match"}, {"id": 2260, "idiom": "mill about", "meaning": "～を動き回る", "ex_en": "Fans were milling about the festival site from the morning.", "ex_ja": "ファンは午前中から会場の各地を動き回っていた。", "core": "人々がぞろぞろ無秩序に「うろうろ動き回る」。", "syn": "wander around（うろつく）／ roam around（散策）／ mosey around（米・のんびり）", "word_key": "mill", "word_def": "(名) 製粉所 (動) (粉にする) ／うろうろ動き回る。mill about/around=うろつく"}, {"id": 2261, "idiom": "mull over", "meaning": "～を熟考する（= chew over）", "ex_en": "She asked for a few weeks to mull over the offer and to discuss it with her family.", "ex_ja": "その提案を熟考し家族と話し合うため、彼女は2、3週間の時間を求めた。", "core": "提案・問題を時間をかけて「じっくり考える」。", "syn": "ponder（堅・熟考）／ contemplate（思案）／ consider（堅）", "word_key": "mull", "word_def": "(動) (飲み物を)温める／じっくり考える。mull over=熟考する。【類】ponder, contemplate"}, {"id": 2262, "idiom": "muscle in on", "meaning": "～に強引に入り込む", "ex_en": "A neighboring gang tried to muscle in on their territory.", "ex_ja": "近隣の暴力団は、そのテリトリーに強引に入り込もうとした。", "core": "ライバル領域・ビジネスに「強引に割り込む」。", "syn": "intrude on（侵入）／ butt in on（口語）／ encroach on（堅・侵食）", "word_key": "muscle in on", "word_def": "(句) 力ずくで割り込む。muscle=筋肉／腕力。【類】encroach on, intrude on"}, {"id": 2263, "idiom": "nail down", "meaning": "～を確定させる", "ex_en": "He finally managed to nail down a meeting.", "ex_ja": "彼はやっとのことで、会議の予定を確定させた。", "core": "予定・契約・容疑者などを「確定させる」。釘で打ちつけるイメージ。", "syn": "pin down（特定）／ finalize（堅・最終決定）／ confirm（確認）", "word_key": "nail down", "word_def": "(句動) 釘で打ちつける→確定させる、特定する。【類】pin down, finalize"}, {"id": 2264, "idiom": "narrow down", "meaning": "～を絞り込む（= determine）", "ex_en": "The detective narrowed down the suspects to two men.", "ex_ja": "刑事は容疑者を2人の男に絞り込んだ。", "core": "候補者・選択肢を「絞り込む」。", "syn": "whittle down（削り込む）／ pare down（削減）／ reduce to（〜まで減らす）", "word_key": "narrow down", "word_def": "(句動) (選択肢を) 絞り込む。⇔ narrow=狭い。【類】whittle down, pare down"}, {"id": 2265, "idiom": "nibble at", "meaning": "～をかじる", "ex_en": "He nibbled at some cheese while he worked at his desk.", "ex_ja": "彼はデスクで仕事をしながらチーズをかじっていた。", "core": "食べ物を「ちょっとずつかじる」。少量を何度も。", "syn": "munch on（むしゃむしゃ）／ snack on（つまむ）／ pick at（少しずつ）", "word_key": "nibble", "word_def": "(動) (少しずつ)かじる、食む。【類】munch, snack on, pick at"}, {"id": 2266, "idiom": "nod off", "meaning": "うとうとして眠り込む（= doze off）", "ex_en": "It had been such a long day that he kept nodding off during the play.", "ex_ja": "その日は本当に長くて疲れる1日だったので、彼は劇中もうとうとしていた。", "core": "講義・運転中などに「うとうとと居眠りする」。", "syn": "doze off（同義）／ drift off（眠りに落ちる）／ nap（仮眠）", "word_key": "nod off", "word_def": "(句動) こっくりと居眠りする。nod=うなずく。【類】doze off, drift off"}, {"id": 2267, "idiom": "nose around", "meaning": "～を嗅ぎ回る", "ex_en": "He hated it when his boss started nosing around his desk.", "ex_ja": "上司が机を嗅ぎ回り始めると、彼はそれをとても嫌った。", "core": "人の物・私生活を「あちこち詮索する」。", "syn": "snoop around（嗅ぎ回る）／ pry into（堅・詮索）／ poke around（探る）", "word_key": "nose around", "word_def": "(句) 鼻を突っ込んで嗅ぎ回る、詮索する。【類】snoop around, pry"}, {"id": 2268, "idiom": "nose out", "meaning": "～に僅差で勝つ", "ex_en": "He just managed to nose out his rivals and win the marathon.", "ex_ja": "彼はぎりぎりライバルに僅差で勝ち、マラソン大会で優勝した。", "core": "ライバルに「鼻先の差で勝つ」。競馬用語から。", "syn": "edge out（わずかに勝つ）／ pip ~ to the post（英・最後の最後で勝つ）", "word_key": "nose out", "word_def": "(句動) (僅差で) 勝つ／嗅ぎ出す。鼻先一つ分のリードから。【類】edge out, beat by a hair"}, {"id": 2269, "idiom": "opt for", "meaning": "～を選ぶ（= choose）", "ex_en": "The students had the choice of taking an exam or writing an essay. Most opted for the latter.", "ex_ja": "学生たちは試験を受けるかレポートを書くか選べた。大半は後者を選んだ。", "core": "複数の選択肢から「～を選び取る」。比較した上での決断。", "syn": "choose（一般）／ go for（口語・選ぶ）／ select（堅）", "word_key": "opt", "word_def": "(動) 選ぶ、選択する。opt for=～を選ぶ／opt out=辞退する。【関】option=選択肢"}, {"id": 2270, "idiom": "own up to", "meaning": "～を白状する（= confess to）", "ex_en": "After the teenager owned up to smoking in the backyard, his father gave him an hour-long lecture on the danger to his health.", "ex_ja": "ティーンエイジャーが裏庭で喫煙していたことを白状すると、父親は1時間かけて健康への害について説教した。", "core": "自分の罪・失敗を観念して「素直に認める」。", "syn": "confess to（同義）／ admit to（認める）／ come clean about（口語・白状）", "word_key": "own up to", "word_def": "(句) 〜を白状する。所有(own)するように受け入れる。【類】confess, admit"}, {"id": 2271, "idiom": "pack off", "meaning": "～を急いで送り出す（= send）", "ex_en": "In the end, they decided to pack off their children to a summer camp.", "ex_ja": "結局、彼らはサマーキャンプに子供たちを急いで送り出すことに決めた。", "core": "子ども・荷物を「あわてて送り出す」。やや強引なニュアンス。", "syn": "ship off（送り出す）／ dispatch（堅・派遣）／ bundle off（追い払う）", "word_key": "pack off", "word_def": "(句動) (荷物のように) 急いで送り出す。【類】ship off, dispatch, bundle off"}, {"id": 2272, "idiom": "palm A off on B", "meaning": "AをBにだまして押し付ける", "ex_en": "He accused the salesman of trying to palm a faulty computer off on him.", "ex_ja": "彼は欠陥コンピューターをだまして自分に押し付けようとしたとして、セールスマンを非難した。", "core": "品質の悪い物を「だまして売りつける」。詐欺的なニュアンス。", "syn": "fob off on（=同義）／ unload on（押し付ける）／ pawn off on（巧みに）", "word_key": "palm", "word_def": "(名) 手のひら／ヤシ (動) 隠し持つ。palm A off on B=AをBに押し付ける。【関】palm reading=手相"}, {"id": 2273, "idiom": "pan out", "meaning": "成功する（= come off, come to the top）", "ex_en": "When their plan did not pan out, they were forced to think again.", "ex_ja": "計画がうまくいかなかった時、彼らは再考を余儀なくされた。", "core": "計画・投資が「うまくいく・実を結ぶ」。砂金を選り分けるイメージ。", "syn": "work out（うまくいく）／ succeed（堅・成功）／ pay off（報われる）", "word_key": "pan out", "word_def": "(句動) (砂金が選り分けられて) 成功する、うまくいく。【類】succeed, work out"}, {"id": 2274, "idiom": "paper over", "meaning": "～を取り繕う（= cover up）", "ex_en": "Although they papered over the quarrel, they were never as friendly again.", "ex_ja": "その喧嘩を取り繕ったが、彼らは二度と元のように仲良くはならなかった。", "core": "亀裂・問題を表面的に隠して「うわべを取り繕う」。", "syn": "gloss over（軽く流す）／ smooth over（円満に見せる）／ patch up（応急処置）", "word_key": "paper over", "word_def": "(句動) (亀裂・問題を) 紙を貼って隠す→取り繕う。【類】gloss over, smooth over"}, {"id": 2275, "idiom": "parcel out", "meaning": "～を分け与える／分配する（= dish out）", "ex_en": "The leader parceled out the remaining rations to his hungry men.", "ex_ja": "リーダーは残った食料を腹を空かせた部下たちに分配した。", "core": "食料・任務などを「公平に分配する」。", "syn": "distribute（堅）／ dish out（配る）／ allot（割り当て）", "word_key": "parcel", "word_def": "(名) 小包 (動) 分配する。parcel out=小分けに配る。【類】distribute, dish out"}, {"id": 2276, "idiom": "pass down", "meaning": "（慣習など）を伝える（= hand down）", "ex_en": "The jewelry had been passed down in his mother's family for generations.", "ex_ja": "その宝石は何世代にもわたり、母方の家族の間で受け継がれてきた。", "core": "世代・代々「受け継いで伝える」。文化・伝統・遺産。", "syn": "hand down（同義）／ bequeath（堅・遺贈）／ pass on（受け渡し）", "word_key": "pass down", "word_def": "(句動) (世代を) 受け継いで伝える。【類】hand down, pass on, bequeath"}, {"id": 2277, "idiom": "pass off A as B", "meaning": "AをBだとして偽る", "ex_en": "The artist was caught trying to pass off one of his own works as a painting by Picasso.", "ex_ja": "その画家は自作の絵をピカソの絵だと偽って売ろうとしているところを摘発された。", "core": "偽物を本物として「通用させようとする」。", "syn": "pose as（〜になりすます）／ masquerade as（堅・偽装）／ pretend to be（口語）", "word_key": "pass off as", "word_def": "(句) (偽物を) 〜と偽る。【類】pose as, masquerade as"}, {"id": 2278, "idiom": "pass up", "meaning": "～を見送る／断る（= give up）", "ex_en": "Don't pass up the pie; it's so good.", "ex_ja": "このパイは断らないで、すごくおいしいから。", "core": "せっかくの機会・誘いを「逃す・断る」。後で後悔のニュアンス。", "syn": "miss out on（機会を逃す）／ turn down（断る）／ forgo（堅・放棄）", "word_key": "pass up", "word_def": "(句動) (機会を) 見送る、断る。【類】turn down, miss out on, forgo"}, {"id": 2279, "idiom": "patch up", "meaning": "～を取り繕う／～に応急処置を施す", "ex_en": "The nations patched up a temporary peace for Christmas.", "ex_ja": "両国はクリスマスの間だけ、一時的な和平を取り繕った。", "core": "喧嘩・関係・服を「応急処置で繕う」。", "syn": "fix up（修理）／ mend（修繕）／ make up（仲直り）", "word_key": "patch up", "word_def": "(句動) パッチで繕う→応急処置／仲直り。【類】fix up, mend, make up"}, {"id": 2280, "idiom": "pay off", "meaning": "（借金など）を完済する／（努力が）報われる", "ex_en": "He took a big risk buying the shares in the company, but it paid off and he was able to use the profit to start his own business.", "ex_ja": "彼は大きなリスクを抱えてその会社の株を買ったが、それが報われ、儲けで自分の事業を立ち上げた。", "core": "努力・投資・賭けが「実を結ぶ・報われる」。", "syn": "yield results（堅）／ bear fruit（実る）／ come good（うまくいく）", "word_key": "pay off", "word_def": "(句動) (借金を) 完済する／(努力が) 報われる／賄賂を払う。多義。【関】payoff=見返り"}, {"id": 2281, "idiom": "pep up", "meaning": "～を元気づける（= ginger up）", "ex_en": "He always tried to pep up his classes with videos and games.", "ex_ja": "彼はいつも、ビデオやゲームで授業を盛り上げようとした。", "core": "元気のないクラス・パーティーを「活気づける」。", "syn": "liven up（同義）／ perk up（元気にする）／ energize（堅・活性化）", "word_key": "pep up", "word_def": "(句動) 元気づける、活気づかせる。pep=活力。【類】perk up, liven up, energize"}, {"id": 2282, "idiom": "perk up", "meaning": "元気になる（= cheer up）", "ex_en": "After they had eaten, the children began to perk up again.", "ex_ja": "食事を済ませた後、子供たちは再び元気になり始めた。", "core": "食事・休憩で疲れた人が「元気を取り戻す」。自動詞。", "syn": "cheer up（元気が出る）／ liven up（活気づく）／ bounce back（回復）", "word_key": "perk up", "word_def": "(句動) (耳・興味を) ピンと立てる→元気になる。【類】cheer up, liven up"}, {"id": 2283, "idiom": "peter out", "meaning": "次第に減って消えてなくなる", "ex_en": "After a while, the letters from their son petered out and they never heard from him again.", "ex_ja": "しばらくすると息子からの手紙が次第に減り、ついには音沙汰もなくなった。", "core": "活動・連絡が「だんだん減って消える」。", "syn": "die out（途絶える）／ taper off（先細る）／ fizzle out（尻すぼみ）", "word_key": "peter out", "word_def": "(句動) 次第に減って消える。地名 Peter から?（語源不明）。【類】die out, fizzle out"}, {"id": 2284, "idiom": "phase out", "meaning": "～を段階的に廃止する", "ex_en": "The auto company gradually phased out production of the old model, although it was still selling well.", "ex_ja": "その自動車会社は販売は好調だったが、古いモデルの生産を段階的に廃止した。", "core": "古い製品・規制・人員を「段階的に廃止する」。", "syn": "phase down（縮小）／ wind down（終息）／ retire（堅・廃止）", "word_key": "phase out", "word_def": "(句動) (段階を踏んで) 廃止する。phase=段階。⇔ phase in。【類】wind down"}, {"id": 2285, "idiom": "piece together", "meaning": "（事実・情報など）をつなぎ合わせる（= put together）", "ex_en": "When he had pieced together the evidence, he realized what had happened.", "ex_ja": "証拠をつなぎ合わせた時、彼は何が起こったのか理解した。", "core": "断片的な情報を「つなぎ合わせて全体像を作る」。", "syn": "put together（同義）／ assemble（組み立て）／ piece by piece（一つずつ）", "word_key": "piece together", "word_def": "(句動) 断片をつなぎ合わせる。ジグソーパズル的。【類】put together, assemble"}, {"id": 2286, "idiom": "pile up", "meaning": "～を蓄積する／たまる", "ex_en": "The work kept piling up and he was forced to do overtime almost every day.", "ex_ja": "仕事がたまり続け、彼はほぼ毎日残業せざるを得なかった。", "core": "仕事・書類・洗濯物が「どんどんたまる」。", "syn": "build up（積み上がる）／ accumulate（堅・蓄積）／ stack up（積み重なる）", "word_key": "pile up", "word_def": "(句動) (物・仕事が) たまる、積み重なる。pile=山。【類】accumulate, stack up"}, {"id": 2287, "idiom": "pin down", "meaning": "～を突き止める（= run down）", "ex_en": "He found it impossible to pin down the cause of the problem.", "ex_ja": "彼にはその問題の原因を突き止めることが不可能だとわかった。", "core": "曖昧な原因・場所を「特定して突き止める」。", "syn": "identify（堅・特定）／ locate（位置を割り出す）／ track down（追跡）", "word_key": "pin down", "word_def": "(句動) ピンで留める→特定する、確定させる。【類】identify, locate, nail down"}, {"id": 2288, "idiom": "pine for", "meaning": "～を切望する（= covet）", "ex_en": "She had been pining for a chance to play on the school team.", "ex_ja": "彼女は学校のチームでプレーする機会を切望していた。", "core": "会えない人・できないことを「切なく思い焦がれる」。", "syn": "long for（堅・切望）／ yearn for（強く望む）／ hanker for（米口語・渇望）", "word_key": "pine", "word_def": "(名) 松 (動) 思い焦がれる。【類】long for, yearn, hanker。【関】pine away=やつれる"}, {"id": 2289, "idiom": "pipe down", "meaning": "静かにする（= quiet down, belt up）", "ex_en": "She shouted to the children to pipe down and go to sleep.", "ex_ja": "彼女は子供たちに、静かにして寝るようにと大声で言った。", "core": "子どもや騒がしい人に「静かにしろ」と言う口語。", "syn": "quiet down（静かに）／ shut up（無礼）／ keep it down（音量下げて）", "word_key": "pipe down", "word_def": "(句動) 静かにしろ。pipe=管・笛。【類】quiet down, hush, shut up"}, {"id": 2290, "idiom": "pitch in", "meaning": "協力する", "ex_en": "Paul thought that it would take ages to clean up after the party, but his friends all pitched in and the place was finished in no time.", "ex_ja": "パーティーの後片付けは時間がかかると思っていたが、友達がみんな手伝ってくれて、あっという間に終わった。", "core": "みんなで「協力して手伝う」。チームワーク強調。", "syn": "join in（参加）／ chip in（一肌脱ぐ）／ lend a hand（手を貸す）", "word_key": "pitch in", "word_def": "(句動) 寄付する／協力する。pitch=投げる→投げ込む。【類】chip in, lend a hand"}, {"id": 2291, "idiom": "play down", "meaning": "～を軽視する（= make light of）", "
