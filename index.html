ex_en": "The school did its best to play down the incident.", "ex_ja": "学校はその事件をできるだけ軽視するようにした。", "core": "事件・問題を「あえて軽く扱う・矮小化する」。", "syn": "downplay（同義）／ make light of（軽視）／ minimize（堅）", "word_key": "play down", "word_def": "(句動) 軽視する、矮小化する。⇔ play up。【類】downplay, make light of"}, {"id": 2292, "idiom": "play off", "meaning": "～をうまく利用する／決勝戦を行う", "ex_en": "As there was no score, the teams had to play off the following week.", "ex_ja": "引き分けに終わったので、両チームは翌週決勝戦をしなければならなかった。", "core": "引き分けの後の「決勝戦をする」、または「相手を競わせる」。", "syn": "have a playoff（決勝戦）／ pit against（戦わせる）", "word_key": "play off", "word_def": "(句動) 決勝戦を行う／(2人を) 競わせて利用する。【関】playoff=決勝戦"}, {"id": 2293, "idiom": "pluck up", "meaning": "（勇気）を奮い起こす", "ex_en": "I'm going to pluck up my courage and ask my boss to give me a raise.", "ex_ja": "勇気を奮い起こして、上司に給料アップを頼もうと思う。", "core": "怖さを乗り越えて「勇気を奮い起こす」。決まり文句。", "syn": "muster up（堅・奮い起こす）／ summon up（呼び起こす）／ work up（高める）", "word_key": "pluck", "word_def": "(動) 摘み取る／(弦を)弾く／勇気を奮い起こす。pluck up courage=勇気を出す"}, {"id": 2294, "idiom": "plug away at", "meaning": "～に取り組み続ける", "ex_en": "He said he was still plugging away at writing novels in his spare time.", "ex_ja": "暇な時間にも小説を書き続けていると彼は言った。", "core": "地道に作業を「コツコツ続ける」。継続が焦点。", "syn": "stick at（堅）／ keep at（継続）／ persevere with（粘る）", "word_key": "plug away at", "word_def": "(句) コツコツ続ける。plug=栓を詰める→こつこつ。【類】stick at, persevere"}, {"id": 2295, "idiom": "plunge into", "meaning": "～に飛び込む", "ex_en": "The young man ran down the beach and plunged into the sea.", "ex_ja": "その若者はビーチを駆け下りて、海に飛び込んだ。", "core": "水・新事業・冒険に「飛び込む」。決意を伴う行動開始。", "syn": "dive into（飛び込む）／ jump into（即座に）／ leap into（堅・跳び込む）", "word_key": "plunge", "word_def": "(動) 飛び込む、突っ込む。plunge into=～に没頭。【関】take the plunge=思い切ってやる"}, {"id": 2296, "idiom": "poke around", "meaning": "探し回る", "ex_en": "The professor loves poking around in second-hand bookshops, looking for works by his favorite authors.", "ex_ja": "教授は古書店をあちこち探し回り、お気に入りの作家の作品を探すのが大好きだ。", "core": "興味本位で「あちこち探し回る」。下心や好奇心。", "syn": "rummage around（あさる）／ snoop around（嗅ぎ回る）／ nose around（探る）", "word_key": "poke around", "word_def": "(句) (棒で) つつき回る→あちこち探す。【類】rummage, snoop, nose around"}, {"id": 2297, "idiom": "pore over", "meaning": "～を熟読する", "ex_en": "He knew that his mother pored over his letters, reading them again and again until she had nearly memorized them.", "ex_ja": "彼は、母親が彼の手紙をほぼ暗記するまで何度も熟読していることを知っていた。", "core": "文書・地図を「じっくり熟読する」。学者的な集中。", "syn": "study（堅・研究）／ scrutinize（堅・精査）／ pore through（同義）", "word_key": "pore", "word_def": "(動) (本などに) 没頭する／(名)毛穴。pore over=熟読する。※pourと混同しない。【類】study"}, {"id": 2298, "idiom": "pull off", "meaning": "～をやってのける", "ex_en": "Make up your mind to pull off something great.", "ex_ja": "何か大きなことを成し遂げようと決意しなさい。", "core": "難しいこと・大胆な行動を「見事にやり遂げる」。", "syn": "carry out（実行）／ accomplish（堅・成し遂げる）／ bring off（やってのける）", "word_key": "pull off", "word_def": "(句動) (難事を) やってのける／(衣服を) 脱ぐ／(車を) 寄せて止める。多義"}, {"id": 2299, "idiom": "pull through", "meaning": "（危機など）を乗り切る", "ex_en": "The patient had a life-threatening disease, but thanks to the new drug, he was able to pull through and recover.", "ex_ja": "その患者は命にかかわる病気だったが、新薬のおかげで乗り切って回復することができた。", "core": "病気・困難・危機を「乗り越えて生き延びる」。", "syn": "get through（乗り切る）／ survive（堅・生存）／ pull off（やり遂げる）", "word_key": "pull through", "word_def": "(句動) (危機を) 乗り越える、回復する。【類】get through, recover, survive"}, {"id": 2300, "idiom": "put down A on B", "meaning": "AをBの頭金として払う", "ex_en": "The couple put down all their savings on the house and borrowed the rest of the money they needed from a bank.", "ex_ja": "その夫婦は貯金全額をその家の頭金として支払い、必要な残額は銀行から借りた。", "core": "家・車購入時に「頭金として支払う」。金融用語。", "syn": "make a down payment（同義・名詞形）／ deposit（手付金）", "word_key": "put down", "word_def": "(句動) 置く／鎮圧する／頭金を払う／批判する。put down on=～の頭金にする"}, {"id": 2301, "idiom": "put down A to B", "meaning": "AをBのせいにする（= attribute A to B）", "ex_en": "Some cynics put down the actress's success to her father's extensive connections in the movie business.", "ex_ja": "その女優の成功は、父親が映画界に持つ広いコネのおかげだと考える皮肉屋もいた。", "core": "成功や失敗の原因を「～のせいだとする」。Bは原因。", "syn": "attribute A to B（同義）／ ascribe A to B（堅）／ blame B for A（責める）", "word_key": "put down to", "word_def": "(句) (原因を) 〜のせいにする。【類】attribute to, ascribe to"}, {"id": 2302, "idiom": "puzzle over", "meaning": "～に頭を悩ませる（= rack one's brain over）", "ex_en": "He sat puzzling over the math problem for at least an hour.", "ex_ja": "彼は少なくとも1時間、数学の問題に頭を悩ませて座っていた。", "core": "難問にずっと「頭を悩ませる」。集中して考え込むイメージ。", "syn": "agonize over（堅・苦悩）／ rack one's brain（必死に考える）／ wrestle with（取り組む）", "word_key": "puzzle over", "word_def": "(句動) (問題に) 頭を悩ませる。【類】agonize over, wrestle with"}, {"id": 2303, "idiom": "rack up", "meaning": "～を獲得する（= win）", "ex_en": "After racking up his first million dollars, he decided to retire.", "ex_ja": "初めての100万ドルを獲得してから、彼は引退することにした。", "core": "得点・記録・財産を「次々と積み上げる」。", "syn": "amass（堅・蓄積）／ chalk up（記録）／ pile up（積み重ねる）", "word_key": "rack", "word_def": "(名) 棚／拷問台 (動) 苦しめる。rack up=積み上げる／rack one's brain=頭を絞る"}, {"id": 2304, "idiom": "rail against", "meaning": "～を激しく非難する（= cry out, lash out）", "ex_en": "The union leader railed against the government's economic policies.", "ex_ja": "労働組合の幹部は、政府の経済政策を激しく非難した。", "core": "政策・不正を「激しく非難する」。憤りを込めて。", "syn": "lash out at（同義）／ inveigh against（堅）／ rant against（口語・わめく）", "word_key": "rail against", "word_def": "(句) 激しく非難する。rail=罵る／柵。【類】lash out at, inveigh against"}, {"id": 2305, "idiom": "rake off", "meaning": "～の分け前を（不正に）取る（= misappropriate）", "ex_en": "He was accused of illegally raking off money from the pension fund.", "ex_ja": "彼は年金資金を不正にピンはねしたとして告発された。", "core": "公金・利益から「不正に上前をはねる」。", "syn": "skim off（着服）／ embezzle（堅・横領）／ siphon off（流用）", "word_key": "rake", "word_def": "(動) 熊手でかき集める。rake off=上前をはねる／rake in=がっぽり儲ける"}, {"id": 2306, "idiom": "rally around", "meaning": "～の力になる／助けになる（= gather round, take sides with）", "ex_en": "When one of the villagers fell ill, the others would always rally around to help.", "ex_ja": "村人の1人が病気になった時、他の人々はいつも応援に駆けつけた。", "core": "困っている仲間を支援するため「結集する」。", "syn": "come together for（同義）／ unite around（堅）／ stand by（寄り添う）", "word_key": "rally", "word_def": "(動) 結集する／(価格が)反発する／集会を開く。rally around=助けに集まる"}, {"id": 2307, "idiom": "rattle off", "meaning": "～をすらすらと言う", "ex_en": "Although her son got poor grades at school, he could rattle off the names of all the players in the football league.", "ex_ja": "学校の成績はあまり良くなかったが、息子はサッカーリーグの全選手の名前をすらすらと挙げることができた。", "core": "名前・数字・台詞を「すらすら言う」。記憶力の見せ場。", "syn": "reel off（同義）／ list off（列挙）／ recite（堅・暗唱）", "word_key": "rattle", "word_def": "(動) ガタガタ鳴る／動揺する。rattle off=すらすら言う。【関】rattlesnake=ガラガラヘビ"}, {"id": 2308, "idiom": "rifle through", "meaning": "～をくまなく探す", "ex_en": "He caught his colleague rifling through the drawers of his desk.", "ex_ja": "彼は、同僚が机の引き出しをくまなく探っているところを見つけた。", "core": "引き出し・書類を「乱暴にひっかき回して探す」。", "syn": "rummage through（あさる）／ ransack（堅・物色）／ go through（くまなく）", "word_key": "rifle", "word_def": "(名) ライフル (動) くまなく探る／略奪する。rifle through=あさる。【類】rummage"}, {"id": 2309, "idiom": "rip through", "meaning": "～を突き抜けて進む（= hit directly）", "ex_en": "A powerful tornado ripped through the area, destroying homes.", "ex_ja": "強力な竜巻がその地域を突き抜けて進み、家屋を破壊した。", "core": "嵐・銃弾・噂が地域・物を「突き抜けて荒らす」。", "syn": "tear through（同義）／ rage through（吹き荒れる）／ devastate（堅）", "word_key": "rip", "word_def": "(動) 引き裂く、突き抜ける。rip through=猛烈な勢いで進む。【関】RIP=安らかに眠れ"}, {"id": 2310, "idiom": "root for", "meaning": "～を応援する（= cheer for）", "ex_en": "One of the presidential candidates, Bill Jones, was from the town so naturally, everyone there was rooting for him in the election.", "ex_ja": "大統領候補のビル・ジョーンズはその町の出身だったので、当然のように地元民は彼を選挙で応援していた。", "core": "チーム・候補者を「応援する」。観戦・選挙。", "syn": "cheer for（応援）／ support（堅）／ pull for（口語・声援）", "word_key": "root for", "word_def": "(句) 応援する。root=根→根底から支える。【類】cheer for, support, pull for"}, {"id": 2311, "idiom": "rope in to V", "meaning": "～に駆り出される", "ex_en": "On Sunday, he found himself roped in to help with the spring cleaning.", "ex_ja": "日曜日に、彼はいつの間にか春の大掃除の手伝いに駆り出されていた。", "core": "乗り気でないのに「手伝いに駆り出される」。", "syn": "be roped into（=同義）／ be dragged into（巻き込まれる）／ be drafted into（徴集）", "word_key": "rope in", "word_def": "(句動) ロープで引き寄せる→駆り出す。【類】drag into, draft, recruit"}, {"id": 2312, "idiom": "rub off on", "meaning": "～に良い影響を与える", "ex_en": "The teacher made him sit next to the most serious boy in the class in the hope that some of his attitude would rub off on him.", "ex_ja": "その子の態度が良い影響を与えるよう願って、先生はクラスで一番真面目な男の子の隣に彼を座らせた。", "core": "良い・悪い性質が周囲の人に「移る」。感染のイメージ。", "syn": "be contagious（伝染性）／ pass on to（伝わる）／ wear off on（薄まり伝わる）", "word_key": "rub off on", "word_def": "(句) (性質が) 擦り付くように移る、影響を与える。【類】wear off on"}, {"id": 2313, "idiom": "ruminate over", "meaning": "～について思いめぐらす", "ex_en": "The idea came to him suddenly one evening when he was sitting ruminating over what he should do after college.", "ex_ja": "大学卒業後何をしようかと思いめぐらしながら座っていたある夜、その考えは突然浮かんだ。", "core": "過去の出来事・選択を「ぐるぐる思案する」。後悔含み。", "syn": "mull over（熟考）／ brood over（くよくよ）／ chew over（じっくり考える）", "word_key": "ruminate", "word_def": "(動) (牛が)反芻する／じっくり考える。【類】mull over, brood, ponder"}, {"id": 2314, "idiom": "run off with", "meaning": "～を持ち逃げする", "ex_en": "The stranger ran off with all the shop's earnings for the month.", "ex_ja": "見ず知らずの男はその店の1か月分の売り上げを持ち逃げした。", "core": "お金・人を持って「逃げる」。誘拐や駆け落ちにも。", "syn": "make off with（盗み逃げ）／ abscond with（堅）／ elope with（駆け落ち）", "word_key": "run off with", "word_def": "(句) 〜を持って逃げる、駆け落ちする。【類】abscond with, elope, steal"}, {"id": 2315, "idiom": "run up", "meaning": "（借金など）を重ねる（= pile up, accumulate）", "ex_en": "Before the man went back to his country, he ran up large debts at various banks.", "ex_ja": "その男は帰国前に、あちこちの銀行で多額の借金を重ねた。", "core": "借金・経費・得点を「積み重ねる」。", "syn": "accumulate（堅・蓄積）／ pile up（積み上げる）／ rack up（記録）", "word_key": "run up", "word_def": "(句動) (借金を) 重ねる／(数値を) 積み上げる。【類】accumulate, rack up"}, {"id": 2316, "idiom": "rustle up", "meaning": "～を急いで準備する", "ex_en": "The late guests asked the landlady to rustle up some supper for them.", "ex_ja": "遅く来た宿泊客は女主人に、夕食を急いで準備してくれるよう頼んだ。", "core": "料理・部屋を「急いで用意する」。間に合わせ感。", "syn": "whip up（さっと作る）／ throw together（適当に）／ knock up（英・即席）", "word_key": "rustle up", "word_def": "(句動) (家畜を盗む rustleから) 急ごしらえで用意する。【類】whip up, throw together"}, {"id": 2317, "idiom": "scrape by on", "meaning": "～でかつかつ暮らしていく（= live from hand to mouth on）", "ex_en": "While he was at college, he managed to scrape by on the allowance that his parents gave him.", "ex_ja": "大学時代、彼は両親がくれる小遣いで何とか暮らしていた。", "core": "わずかな収入で「かろうじて生計を維持する」。", "syn": "get by on（やりくり）／ make do with（間に合わせる）／ live from hand to mouth（その日暮らし）", "word_key": "scrape by", "word_def": "(句動) かろうじて生計を立てる、ぎりぎり通り抜ける。【類】get by, eke out"}, {"id": 2318, "idiom": "scrape together", "meaning": "～をかき集める", "ex_en": "Her parents managed to scrape together the money for her to go to college.", "ex_ja": "彼女の両親は、娘を大学へ行かせるためのお金を何とかかき集めた。", "core": "お金・労力を必死に「かき集める」。やりくり感。", "syn": "scrabble together（必死に）／ rustle up（即席）／ pull together（まとめる）", "word_key": "scrape together", "word_def": "(句) (お金を) 必死にかき集める。【類】scrabble together, pull together"}, {"id": 2319, "idiom": "scratch out", "meaning": "（生計）をどうにか立てる（= scrape by）", "ex_en": "After they married, they scratched out a living on his meager wages.", "ex_ja": "彼らは結婚後、彼のわずかな給料でなんとか暮らしを立てていた。", "core": "乏しい収入で「ぎりぎり生活する」。", "syn": "scrape by（同義）／ eke out（やっと立てる）／ get by（やりくり）", "word_key": "scratch out", "word_def": "(句動) 引っ掻いて消す／(生計を) どうにか立てる。【類】scrape by, eke out"}, {"id": 2320, "idiom": "scrub up", "meaning": "徹底的に手洗いをする", "ex_en": "The doctor and nurses began to scrub up in preparation for the operation.", "ex_ja": "医師と看護師たちは手術の準備のため、徹底的に手洗いを始めた。", "core": "手術前に医師が「徹底的に手を洗う」。医療用語。", "syn": "wash up（手洗い）／ disinfect（消毒）／ scrub down（こすり洗い）", "word_key": "scrub", "word_def": "(動) ごしごし磨く／(計画を)中止する。scrub up=徹底的に手洗い。【関】scrubs=手術着"}, {"id": 2321, "idiom": "scuffle with", "meaning": "～と乱闘する", "ex_en": "Several demonstrators scuffled with the police and were arrested.", "ex_ja": "数人のデモ参加者は警官と乱闘し、逮捕された。", "core": "警察・敵対者と「もみ合う・乱闘する」。", "syn": "clash with（衝突）／ tussle with（小競り合い）／ grapple with（取っ組み合う）", "word_key": "scuffle", "word_def": "(動) 取っ組み合う、もみ合う。【類】tussle, brawl, grapple"}, {"id": 2322, "idiom": "set forth", "meaning": "～を説明する（= account for）", "ex_en": "He set forth his plans for reform to the board of directors.", "ex_ja": "彼は役員に対して改革の計画を説明した。", "core": "計画・主張を「正式に説明・提示する」。文書的。", "syn": "outline（概要）／ lay out（明示）／ present（堅・提示）", "word_key": "set forth", "word_def": "(句動) (計画を) 説明する／出発する。【類】outline, present, lay out"}, {"id": 2323, "idiom": "settle on", "meaning": "～を決める（= decide on）", "ex_en": "After much discussion, they finally settled on a day for the wedding.", "ex_ja": "十分な議論の末、彼らはついに挙式の日取りを決めた。", "core": "協議の末に日取り・選択肢を「決める」。", "syn": "decide on（同義）／ agree on（合意）／ go with（口語・選ぶ）", "word_key": "settle on", "word_def": "(句) (案を) 決める／(土地に) 住み着く。【類】decide on, agree on"}, {"id": 2324, "idiom": "shell out", "meaning": "（金額）をしぶしぶ支払う（= fork out）", "ex_en": "How much did you shell out for your uniform?", "ex_ja": "制服にいくら支払ったの？", "core": "高額をいやいや「払う」。痛みを伴う支出。", "syn": "fork out（=同義）／ cough up（吐き出す）／ stump up（英）", "word_key": "shell", "word_def": "(名) 殻、貝殻 (動) 殻を取る／砲撃する。shell out=渋々支払う。【類】fork out, cough up"}, {"id": 2325, "idiom": "shove around", "meaning": "～を意のままに使う（= push around）", "ex_en": "The school bully was always shoving around the smaller boys.", "ex_ja": "学校のいじめっ子は、いつも自分よりひ弱な子を意のままに使っていた。", "core": "弱い者を「乱暴に扱う」。いじめ的な含意。", "syn": "push around（=同義）／ bully（いじめる）／ throw one's weight around（横柄）", "word_key": "shove", "word_def": "(動) ぐいと押す、突き飛ばす。shove around=意のままに使う。【類】push around, bully"}, {"id": 2326, "idiom": "show out", "meaning": "～を見送る", "ex_en": "He stood at the front door and showed the guests out one by one.", "ex_ja": "彼は玄関に立ち、客を1人ずつ見送った。", "core": "お客を玄関まで「丁寧に見送る」。", "syn": "see off（見送る）／ usher out（堅・案内）／ escort out（同伴）", "word_key": "show out", "word_def": "(句動) (客を) 玄関まで送る。【類】see off, escort out, usher out"}, {"id": 2327, "idiom": "shrug off", "meaning": "～を気にしない（= not care）", "ex_en": "Whatever failures he suffered, he always shrugged them off and began again.", "ex_ja": "どんな失敗をしても、彼はいつもそれを気にせず、また始めた。", "core": "批判・失敗を「気にせず受け流す」。気持ちの切り替え。", "syn": "brush off（無視）／ dismiss（堅・退ける）／ ignore（無視する）", "word_key": "shrug", "word_def": "(動) (肩を)すくめる。shrug off=肩をすくめて受け流す→気にしない。【類】brush off, dismiss"}, {"id": 2328, "idiom": "shy away from", "meaning": "～を避ける", "ex_en": "Those present at the party shied away from Susie.", "ex_ja": "パーティーの出席者は、スージーを避けた。", "core": "人・話題を「気まずさから避ける」。引っ込み思案。", "syn": "avoid（避ける）／ steer clear of（堅・避ける）／ keep one's distance from（距離を置く）", "word_key": "shy away from", "word_def": "(句) (恥ずかしくて) 〜を避ける。shy=内気な。【類】avoid, steer clear of"}, {"id": 2329, "idiom": "simmer down", "meaning": "気持ちを静める（= calm down）", "ex_en": "He lost his temper and resigned on the spot, but later, after he had simmered down, he began to regret what he had done.", "ex_ja": "彼はかっとなってその場で辞表を出したが、後になって落ち着くと、自分のしたことを後悔し始めた。", "core": "怒り・興奮が「徐々に静まる」。沸騰した湯が冷めるイメージ。", "syn": "calm down（同義）／ cool off（頭を冷やす）／ chill out（口語）", "word_key": "simmer", "word_def": "(動) (沸騰直前で)煮立つ／(怒りが)くすぶる。simmer down=気持ちを静める。【類】calm down"}, {"id": 2330, "idiom": "sink in to", "meaning": "～に十分に理解される（= be deeply understood）", "ex_en": "When will it sink in to you that the only way to pass exams is by studying for them?", "ex_ja": "試験に受かる唯一の方法は勉強することだと、いつになったらわかってもらえるんだろうか？", "core": "情報・教訓が「ようやく腑に落ちる」。理解が浸透する。", "syn": "register with（理解される）／ get through to（届く）／ dawn on（堅・気づく）", "word_key": "sink in", "word_def": "(句動) (情報が) しみ込む、腑に落ちる。【類】register, dawn on, get through"}, {"id": 2331, "idiom": "siphon off", "meaning": "（資金など）を流用する", "ex_en": "The official was arrested for siphoning off money intended for the relief of the earthquake victims.", "ex_ja": "その公務員は、地震被災者救済のための資金を流用したことで逮捕された。", "core": "資金を不正に「ちょろまかす・流用する」。", "syn": "embezzle（堅・横領）／ skim off（着服）／ divert（堅・流用）", "word_key": "siphon", "word_def": "(名) サイフォン (動) 吸い上げる／(資金を)流用する。【類】embezzle, divert"}, {"id": 2332, "idiom": "skim off", "meaning": "（金）を着服する", "ex_en": "It was discovered that the bank's manager had been skimming off money from his customers' accounts for years.", "ex_ja": "その銀行の支店長が顧客の口座から金を何年もくすねていたことが発覚した。", "core": "売上・利益から「上前をはねる」。", "syn": "skim（薄くすくう）／ pocket（自分のものにする）／ pilfer（堅・くすねる）", "word_key": "skim", "word_def": "(動) (上澄みを)すくう／拾い読みする／(金を)着服する。【関】skim milk=低脂肪乳"}, {"id": 2333, "idiom": "slip by", "meaning": "（時）が素早く過ぎる", "ex_en": "Their time together on weekends always slipped by quickly.", "ex_ja": "彼らの週末の一緒の時間は、いつも素早く過ぎ去っていた。", "core": "時間が「あっという間に過ぎる」。受動的な時の経過。", "syn": "fly by（飛ぶように）／ pass quickly（さっと過ぎる）／ slip away（音もなく）", "word_key": "slip by", "word_def": "(句動) (時が) するりと過ぎる、知らぬ間に経過する。【類】fly by, pass quickly"}, {"id": 2334, "idiom": "smooth down", "meaning": "～をなだめる（= calm down）", "ex_en": "She did her best to smooth down her parents' irritation.", "ex_ja": "彼女は両親のいら立ちをなだめるために最善を尽くした。", "core": "怒り・苛立ちを「優しくなだめる」。", "syn": "calm down（落ち着かせる）／ soothe（堅・なだめる）／ pacify（堅・宥和）", "word_key": "smooth down", "word_def": "(句動) なめらかにする→なだめる。【類】calm, soothe, pacify"}, {"id": 2335, "idiom": "smooth over", "meaning": "～を取り繕う", "ex_en": "He tried to smooth over the mistakes but it was quickly noticed.", "ex_ja": "彼はミスを取り繕おうとしたが、すぐに気づかれた。", "core": "失敗・不和を「うまく取り繕う」。表面を整える。", "syn": "patch up（応急処置）／ paper over（取り繕う）／ gloss over（軽く流す）", "word_key": "smooth over", "word_def": "(句動) (亀裂を) 平らにする→取り繕う。【類】patch up, gloss over, paper over"}, {"id": 2336, "idiom": "snap off", "meaning": "～を折る（= break off）", "ex_en": "The boys snapped off the long icicles and used them as swords.", "ex_ja": "少年たちは長いつららを折って、それを剣にして遊んだ。", "core": "枝・チョコなどを「ポキッと折る」。鋭い破断音のイメージ。", "syn": "break off（折る）／ snap（パキッと）／ crack off（割る）", "word_key": "snap off", "word_def": "(句動) ポキッと折る。snap=パチンと鳴る／写真を撮る／キレる。【類】break off"}, {"id": 2337, "idiom": "snap up", "meaning": "～を急いで買う", "ex_en": "Demand for housing was so strong that any new properties that came on the market were snapped up immediately.", "ex_ja": "住宅需要が非常に強かったので、市場に出てきた新物件はすべてすぐに買い取られた。", "core": "商品・チャンスを「素早く買い占める」。", "syn": "buy up（買い占める）／ grab up（つかみ取る）／ scoop up（さらう）", "word_key": "snap up", "word_def": "(句動) (商品を) 素早く買い占める。【類】buy up, scoop up, grab"}, {"id": 2338, "idiom": "soak up", "meaning": "（雰囲気など）を楽しむ（= drink up, take in）", "ex_en": "For a few days, he just soaked up the local atmosphere in the town.", "ex_ja": "数日間、彼はその町の地元の雰囲気を楽しんだ。", "core": "陽光・知識・雰囲気を「吸い取る・楽しむ」。", "syn": "absorb（堅・吸収）／ take in（取り入れる）／ drink in（堅・味わう）", "word_key": "soak", "word_def": "(動) 浸す、吸収する。soak up=(雰囲気・知識を) 吸い取る。【類】absorb, take in"}, {"id": 2339, "idiom": "sort out", "meaning": "～を整理する", "ex_en": "Her first job was to sort out all the papers left by her predecessor.", "ex_ja": "彼女の最初の仕事は、前任者が残した全ての書類を整理することだった。", "core": "散らかった物・問題を「整理して片付ける」。", "syn": "tidy up（整える）／ organize（整理）／ straighten out（解決する）", "word_key": "sort out", "word_def": "(句動) 分類する、整理する／問題を解決する。【類】organize, tidy up, straighten out"}, {"id": 2340, "idiom": "sound A out on B", "meaning": "BについてAの意向を確かめる", "ex_en": "Sound him out on whether he's interested in moving.", "ex_ja": "彼が引っ越しに興味があるか確かめてみて。", "core": "提案について「相手の意向を探る」。慎重な打診。", "syn": "feel out（探る）／ probe（堅・調査）／ test the waters（様子見）", "word_key": "sound out", "word_def": "(句動) (人の意向を) 探る。音波で測るイメージ。【類】feel out, probe, test"}, {"id": 2341, "idiom": "sound off", "meaning": "～について自分の意見を強く述べる", "ex_en": "At dinner his father began sounding off again about politics and what he would do if he were president.", "ex_ja": "夕食の席で父は、自分が大統領になったらどうするかについて、再び政治について自説を強く語り始めた。", "core": "自分の意見を「うるさく主張する」。批判的なニュアンス。", "syn": "rant about（怒鳴り散らす）／ hold forth on（堅・長広舌）／ go on about（くどい）", "word_key": "sound off", "word_def": "(句動) (意見を) 大声で主張する。【類】rant, hold forth, go on about"}, {"id": 2342, "idiom": "spin off", "meaning": "（会社）を子会社として分離する", "ex_en": "The popular police drama has already spun off two other series based on characters from the show.", "ex_ja": "その人気刑事ドラマはすでに、登場人物を扱った2つのシリーズを派生させている。", "core": "親会社から子会社・派生作品を「分離・派生させる」。", "syn": "split off（分離）／ separate from（分かれる）／ derive from（派生）", "word_key": "spin off", "word_def": "(句動) (派生作品・子会社を) 分離独立させる。【関】spin-off=派生製品"}, {"id": 2343, "idiom": "spoil for", "meaning": "～を切望する", "ex_en": "The opposition had been spoiling for a fight with the government for months and the scandal was the perfect opportunity.", "ex_ja": "野党は数か月にわたり政府とやり合いたくてうずうずしていたので、そのスキャンダルは絶好の機会だった。", "core": "喧嘩・対決などを「うずうず待ち望む」。", "syn": "be itching for（うずうず）／ be eager for（堅・熱望）／ be raring for（口語・はやる）", "word_key": "spoil for", "word_def": "(句) 〜したくてうずうずする (be spoiling for a fight)。【類】itch for, be eager for"}, {"id": 2344, "idiom": "sponge off", "meaning": "（親のすね）をかじる", "ex_en": "The student said he hated people who just sponged off their parents.", "ex_ja": "その学生は、ただ親のすねをかじっているだけの人が嫌いだと言った。", "core": "親などに頼って「すねかじりする」。批判的な口語。", "syn": "freeload off（タダ乗り）／ leech off（吸い取る）／ live off（依存）", "word_key": "sponge", "word_def": "(名) スポンジ (動) ぶら下がって生きる。sponge off=～にたかる。【類】freeload, leech"}, {"id": 2345, "idiom": "spring up", "meaning": "急に出てくる／現れる", "ex_en": "In no time at all, new factories began to spring up in the town.", "ex_ja": "あっという間に、新しい工場が町に次々と現れ始めた。", "core": "草木のように「次々と現れる・湧き出る」。", "syn": "pop up（突然出る）／ emerge（堅・出現）／ crop up（持ち上がる）", "word_key": "spring up", "word_def": "(句動) ぱっと現れる、急に出てくる。spring=ばね／泉／春。【類】pop up, emerge"}, {"id": 2346, "idiom": "spur on", "meaning": "～を奮起させる（= motivate, encourage）", "ex_en": "He did not enjoy studying law, but he was spurred on by the thought of the money he could make once he qualified as a lawyer.", "ex_ja": "彼は法律の勉強は好きでなかったが、弁護士になれば稼げる金のことを思い、奮起した。", "core": "動機・名誉欲が人を「奮い立たせる」。拍車を入れるイメージ。", "syn": "motivate（堅・動機付け）／ encourage（励ます）／ incentivize（堅・誘因）", "word_key": "spur", "word_def": "(名) 拍車 (動) 拍車を入れる→駆り立てる。spur on=奮起させる。【類】motivate, urge"}, {"id": 2347, "idiom": "square up", "meaning": "支払いを済ませる", "ex_en": "After squaring up with the cashier, the couple left the restaurant.", "ex_ja": "レジ係への支払いを済ませて、カップルはレストランを出た。", "core": "勘定・借りを「清算する」。お金や決着の意味。", "syn": "settle up（精算）／ pay up（支払い）／ even up（イーブンに）", "word_key": "square up", "word_def": "(句動) 勘定を清算する／向き合う。square=四角／公正。【類】settle up, pay up"}, {"id": 2348, "idiom": "squeeze in", "meaning": "～を（スケジュールに）割り込ませる", "ex_en": "The dentist promised to squeeze her in in-between appointments.", "ex_ja": "歯科医は予約の合間に彼女を割り込ませることを約束した。", "core": "隙間時間に予約・人を「無理やり押し込む」。", "syn": "fit in（収める）／ slot in（はめ込む）／ work in（組み込む）", "word_key": "squeeze in", "word_def": "(句動) 隙間にぎゅっと押し込む。【類】fit in, slot in, work in"}, {"id": 2349, "idiom": "stamp out", "meaning": "～を撲滅する（= eradicate, eliminate）", "ex_en": "The principal swore to stamp out any smoking in his school.", "ex_ja": "校長は学校内での喫煙を撲滅することを誓った。", "core": "悪習・犯罪を「根絶する」。撲滅作戦のニュアンス。", "syn": "eradicate（堅・根絶）／ wipe out（一掃）／ root out（根こそぎ）", "word_key": "stamp out", "word_def": "(句動) 踏み消す→撲滅する。stamp=切手／踏みつける。【類】eradicate, wipe out"}, {"id": 2350, "idiom": "stand in for", "meaning": "～の代役を務める（= step in for）", "ex_en": "The old man fell ill so his son had to stand in for him at the ceremony.", "ex_ja": "その老人は体調を崩したので、息子が父親の代理で式典に出席した。", "core": "欠席者の「代役を務める」。一時的な代理。", "syn": "fill in for（同義）／ substitute for（代用）／ deputize for（堅・代理）", "word_key": "stand in for", "word_def": "(句) 〜の代役を務める。stand-in=代役、スタンドイン。【類】substitute, fill in"}, {"id": 2351, "idiom": "stand out", "meaning": "目立つ（= be conspicuous）", "ex_en": "Her height and bright red hair meant that she always stood out in a crowd.", "ex_ja": "背が高く明るい赤毛だったので、彼女はいつも人込みの中で目立った。", "core": "群衆・背景の中で「目立つ」。ポジティブな意味で。", "syn": "be conspicuous（堅・目立つ）／ stick out（突出）／ catch the eye（目を引く）", "word_key": "stand out", "word_def": "(句動) 突き出る→目立つ。【類】be conspicuous, stick out, catch the eye"}, {"id": 2352, "idiom": "stand up for", "meaning": "～を支持する（= defend, support）", "ex_en": "At the memorial service, his friend said that John Robinson had always stood up for his beliefs, even when it had made him unpopular.", "ex_ja": "追悼式で、ジョン・ロビンソンは不人気になっても常に自分の信念を貫く人だったと友人が語った。", "core": "信念・弱者を「擁護する・声を上げる」。", "syn": "defend（堅・擁護）／ champion（堅・支持）／ back up（支援）", "word_key": "stand up for", "word_def": "(句) 〜を擁護する、信念を貫いて支える。【類】defend, champion, back up"}, {"id": 2353, "idiom": "stick around", "meaning": "近くで待つ／辺りをぶらぶらする", "ex_en": "George told me to stick around so we could play catch.", "ex_ja": "ジョージはキャッチボールができるように近くで待つようにと言った。", "core": "立ち去らず「近くで待つ・とどまる」。", "syn": "hang around（同義）／ wait around（待つ）／ linger（堅・残る）", "word_key": "stick around", "word_def": "(句動) 立ち去らずぶらぶら待つ。stick=くっつく。【類】hang around, linger"}, {"id": 2354, "idiom": "stick up for", "meaning": "～を弁護する", "ex_en": "James stuck up for his friend and defended him against their classmates.", "ex_ja": "ジェームズは友達をかばって、同級生たちから彼を守った。", "core": "いじめ・批判から友人・弱者を「擁護する」。", "syn": "stand up for（=同義）／ defend（守る）／ back up（援護）", "word_key": "stick up for", "word_def": "(句) (人を) かばう、弁護する。【類】defend, stand up for, back up"}, {"id": 2355, "idiom": "stir up", "meaning": "（感情など）をかき立てる／（騒ぎ）を引き起こす", "ex_en": "The union leader was accused of trying to stir up discontent among the workers.", "ex_ja": "労働組合の幹部は、労働者たちの不満をかき立てようとしたとして非難された。", "core": "不満・騒ぎ・感情を「煽動・喚起する」。", "syn": "incite（堅・扇動）／ provoke（挑発）／ whip up（あおる）", "word_key": "stir up", "word_def": "(句動) かき混ぜる→(感情・騒ぎを) 引き起こす。【類】incite, provoke, whip up"}, {"id": 2356, "idiom": "store up", "meaning": "～を蓄える（= lay ~ in stock）", "ex_en": "The villagers began to store up vegetables to last them through the winter.", "ex_ja": "村人たちは冬を越すため野菜を蓄え始めた。", "core": "食料・燃料を冬・非常時に備え「貯蔵する」。", "syn": "stockpile（堅・備蓄）／ stash away（隠し置く）／ lay in（蓄える）", "word_key": "store up", "word_def": "(句動) 蓄える、貯蔵する。【類】stockpile, lay in, hoard"}, {"id": 2357, "idiom": "strike off", "meaning": "～を除名する（= disaffiliate）", "ex_en": "After he was caught cheating, his name was struck off the club's membership.", "ex_ja": "彼はカンニングが見つかり、クラブの会員名簿から名前を除名された。", "core": "会員・選手を名簿から「除名・抹消する」。", "syn": "expel（堅・除名）／ remove from（取り除く）／ disbar（堅・資格剥奪）", "word_key": "strike off", "word_def": "(句動) (名簿から) 抹消する／(枝を) 切り落とす。【類】expel, remove, delete"}, {"id": 2358, "idiom": "strike up", "meaning": "（関係）を取り結ぶ／（演奏）を始める", "ex_en": "The two new employees struck up a friendship that was to last the rest of their lives.", "ex_ja": "2人の新入社員の間に、生涯続くことになる友情が芽生えた。", "core": "会話・友情・演奏を「始める」。", "syn": "initiate（堅・開始）／ kick off（口語・始める）／ launch into（勢いよく）", "word_key": "strike up", "word_def": "(句動) (会話・友情を) 始める／(演奏を) 始める。【類】start, initiate, kick off"}, {"id": 2359, "idiom": "stumble upon", "meaning": "～に思いがけず出くわす", "ex_en": "Late one night, the scientist stumbled upon a solution to the problem.", "ex_ja": "ある夜遅く、その科学者は問題に対する解決方法を偶然発見した。", "core": "偶然「ばったり出くわす・思いがけず見つける」。", "syn": "come across（出くわす）／ happen upon（堅）／ chance upon（偶然）", "word_key": "stumble", "word_def": "(動) つまずく／よろめく。stumble upon=偶然出くわす。【類】come across, chance upon"}, {"id": 2360, "idiom": "suck up to", "meaning": "～の機嫌をとる", "ex_en": "His superior told him to stop sucking up to him all the time.", "ex_ja": "彼の上司は、しょっちゅう機嫌をとるのはやめるようにと彼に言った。", "core": "上司・権力者に「ゴマをする」。へつらいの軽蔑語。", "syn": "kiss up to（米俗）／ butter up（おべっか）／ ingratiate oneself with（堅）", "word_key": "suck up to", "word_def": "(句) ゴマをする、こびる。下品な口語。【類】kiss up to, butter up, brown-nose"}, {"id": 2361, "idiom": "sweat it out", "meaning": "はらはらしながら最後まで頑張り通す（= endure it）", "ex_en": "I have to sweat it out until I get my test result back.", "ex_ja": "テスト結果が戻ってくるまで、私はハラハラしながら待たなければならない。", "core": "不安な状況を「ハラハラしながら耐え抜く」。", "syn": "tough it out（粘る）／ ride it out（乗り切る）／ wait it out（じっと待つ）", "word_key": "sweat it out", "word_def": "(句) 汗をかきながら耐え抜く、ハラハラ待つ。【類】tough it out, ride it out"}, {"id": 2362, "idiom": "tack on", "meaning": "～を付け加える（= add ~ to）", "ex_en": "He found that the hotel had tacked on some extra charges.", "ex_ja": "彼は、ホテルが追加料金を加算していたことに気づいた。", "core": "元の料金や条件に「上乗せする・追加する」。", "syn": "add on（追加）／ append（堅・付加）／ tag on（付け加える）", "word_key": "tack", "word_def": "(名) 鋲 (動) 鋲で留める／針路を変える。tack on=付け加える。【類】add on, append"}, {"id": 2363, "idiom": "take in", "meaning": "～をだます／～を理解する（= deceive, understand）", "ex_en": "She had been completely taken in by her friend's lie, so she was shocked to discover it was not true.", "ex_ja": "彼女は友人の嘘にすっかりだまされていたので、それが事実でないと知ってショックを受けた。", "core": "①信用させて騙す ②情報を理解する。文脈で判別。", "syn": "deceive（堅・欺く）／ fool（だます）／ comprehend（堅・理解）", "word_key": "take in", "word_def": "(句動) 取り込む／だます／理解する／泊める。多義の重要句動詞。【関】intake=摂取量"}, {"id": 2364, "idiom": "take it out on", "meaning": "～に当たり散らす（= take one's anger out on）", "ex_en": "Mother takes it out on me when she feels frustrated.", "ex_ja": "母はストレスを感じると、私に当たり散らす。", "core": "八つ当たりで関係ない人に「怒りをぶつける」。", "syn": "vent on（堅・発散）／ lash out at（攻撃）／ take it out on（=同義）", "word_key": "take it out on", "word_def": "(句) (関係ない人に)八つ当たりする。【類】vent on, lash out at"}, {"id": 2365, "idiom": "take off", "meaning": "（売り上げなどが）急に伸びる", "ex_en": "At first, the new product looked as though it might not take off, but then in March, sales began to soar.", "ex_ja": "新製品は最初は売れないように見えたが、3月になると売り上げが急に伸び始めた。", "core": "売上・人気が「急上昇する」。離陸のイメージ。", "syn": "soar（堅・舞い上がる）／ skyrocket（急騰）／ surge（堅・急上昇）", "word_key": "take off", "word_def": "(句動) 離陸する／急上昇する／脱ぐ／休みを取る。多義。【関】takeoff=離陸"}, {"id": 2366, "idiom": "take on", "meaning": "（性質など）を帯びる／（仕事）を引き受ける（= assume）", "ex_en": "The leaves are taking on their brilliant hues.", "ex_ja": "木々の葉が鮮やかな色合いを帯びてきている。", "core": "仕事・性質を「引き受ける・帯びる」。多義語。", "syn": "assume（堅・引き受ける）／ undertake（堅・着手）／ adopt（採用）", "word_key": "take on", "word_def": "(句動) (仕事・性質を) 引き受ける／帯びる／(人と)対戦する。多義"}, {"id": 2367, "idiom": "take to", "meaning": "～を好きになる（= fall for）", "ex_en": "Although they had not met before, the child immediately took to him.", "ex_ja": "以前会ったことはなかったが、その子はすぐに彼を好きになった。", "core": "会ったばかりの人に「すぐ好意を抱く」。", "syn": "warm to（堅・好感）／ take a liking to（同義）／ take a shine to（口語）", "word_key": "take to", "word_def": "(句動) 〜を好きになる／(習慣を) 始める。【類】warm to, take a liking to"}, {"id": 2368, "idiom": "talk down", "meaning": "～を論破する（= argue one down）", "ex_en": "At the meeting, he managed to talk down those opposing the plan.", "ex_ja": "会議で、彼はその計画に反対する者たちを論破することができた。", "core": "反対意見を「議論で論破する」。説得のニュアンス。", "syn": "argue down（=同義）／ outargue（言い負かす）／ refute（堅・論駁）", "word_key": "talk down", "word_def": "(句動) 言い負かす／(価値を) 下げて言う／優しく説得する。【類】argue down, refute"}, {"id": 2369, "idiom": "tap into", "meaning": "～を利用する（= enter, exploit）", "ex_en": "The clothing store decided to launch a new youth brand in order to tap into the expanding teenage market.", "ex_ja": "その服飾店は、拡大する10代向け市場に進出するため、新しい若者向けブランドを立ち上げた。", "core": "市場・才能・資源を「うまく利用する」。", "syn": "exploit（堅・活用）／ leverage（堅・てこ入れ）／ make use of（利用）", "word_key": "tap into", "word_def": "(句) (資源・市場を) 利用する。tap=蛇口／軽く叩く。【類】exploit, leverage"}, {"id": 2370, "idiom": "taper off", "meaning": "先細りになる", "ex_en": "At first, sales grew steadily, but then they began to taper off as the economy weakened.", "ex_ja": "当初は売り上げが順調に伸びていたが、不景気になるにつれ先細りになり始めた。", "core": "勢いがあったものが「徐々に減って細る」。", "syn": "diminish（堅・減少）／ dwindle（堅・先細り）／ wane（堅・衰退）", "word_key": "taper", "word_def": "(名) 細いろうそく (動) 先細りになる。taper off=徐々に減る。【類】dwindle, diminish"}, {"id": 2371, "idiom": "tear down", "meaning": "～を取り壊す（= demolish）", "ex_en": "She was strongly opposed to the plan to tear down the old city hall and build a new one.", "ex_ja": "彼女は、古い市庁舎を取り壊して新しい庁舎を建てる計画に強く反対した。", "core": "建物を「取り壊す」。物理的破壊。", "syn": "demolish（堅・解体）／ knock down（取り壊す）／ raze（堅・更地化）", "word_key": "tear down", "word_def": "(句動) 引き裂く→取り壊す／(評判を) 落とす。【類】demolish, knock down, raze"}, {"id": 2372, "idiom": "thin out", "meaning": "～を減らす（= cut back）", "ex_en": "The company decided to thin out the sales staff at their stores.", "ex_ja": "その会社は店舗の販売員を減らすことに決定した。", "core": "人員・植物を「間引く・減らす」。", "syn": "reduce（堅・削減）／ cut back（縮小）／ trim down（絞る）", "word_key": "thin out", "word_def": "(句動) (人員・植物を) 間引く、減らす。【類】reduce, cut back, prune"}, {"id": 2373, "idiom": "thrash out", "meaning": "～を徹底的に議論する（= discuss ~ fully）", "ex_en": "We must hold a meeting to thrash out our marketing policy for next year.", "ex_ja": "会議を開いて、来年度のマーケティング方針を徹底的に議論しなければならない。", "core": "複雑な問題を「徹底的に議論し尽くす」。", "syn": "hash out（米・議論）／ work out（解決）／ deliberate on（堅・熟議）", "word_key": "thrash", "word_def": "(動) 鞭打つ／(議論を) 激しく交わす。thrash out=徹底議論する。【類】hash out"}, {"id": 2374, "idiom": "throw in", "meaning": "～を加える", "ex_en": "Every so often, the chairman threw in a comment of his own.", "ex_ja": "折に触れて、議長は自分のコメントを差し挟んだ。", "core": "会話・記事に意見・要素を「割り込ませて加える」。", "syn": "interject（堅・差し挟む）／ insert（堅・挿入）／ add in（加える）", "word_key": "throw in", "word_def": "(句動) (会話に) 投げ込む→加える／(おまけで) 付ける。【類】interject, add in"}, {"id": 2375, "idiom": "tide ~ over", "meaning": "（人）に切り抜けさせる", "ex_en": "He borrowed some money from the bank to tide him over until the new year.", "ex_ja": "彼は新年までを切り抜けるために、銀行から少しお金を借りた。", "core": "お金・支援で困窮を「一時的に乗り切らせる」。", "syn": "see ~ through（持ちこたえさせる）／ help ~ get by（やりくり）", "word_key": "tide over", "word_def": "(句動) 潮(tide)で乗り越えさせる→困難を切り抜けさせる。【類】see through, help get by"}, {"id": 2376, "idiom": "tie A in with B", "meaning": "AをBと結びつける（= connect ~ with）", "ex_en": "They planned to tie the ceremony in with the opening of the new library.", "ex_ja": "彼らは式典を新図書館の開館と結びつけることを計画した。", "core": "イベント・テーマを別の事柄に「結びつける」。", "syn": "link with（結びつける）／ associate with（堅・関連付け）／ connect to（つなぐ）", "word_key": "tie in with", "word_def": "(句) 〜と結びつける。tie=結ぶ／ネクタイ。【類】link with, connect with"}, {"id": 2377, "idiom": "tip off", "meaning": "～に密告する（= give away）", "ex_en": "One of the terrorists tipped off the local police about the upcoming attack.", "ex_ja": "テロリストの1人が今度の襲撃について、地元警察に密告した。", "core": "警察・記者に内部情報を「密告・通報する」。", "syn": "inform on（密告）／ alert（堅・警告）／ blow the whistle on（内部告発）", "word_key": "tip off", "word_def": "(句動) (内部情報を) 密告する。tip=チップ／秘密情報。【関】tipster=情報屋"}, {"id": 2378, "idiom": "tower over", "meaning": "～をはるかに超える", "ex_en": "The scientist's achievements towered over those of his contemporaries.", "ex_ja": "その科学者の業績は同時代の人々の業績をはるかに超えていた。", "core": "身長・業績が周囲を「圧倒的に超える」。", "syn": "dwarf（堅・小さく見せる）／ surpass（堅・凌ぐ）／ outshine（堅・凌駕）", "word_key": "tower over", "word_def": "(句) (高さ・能力で) はるかに上回る。tower=塔。【類】dwarf, surpass, outshine"}, {"id": 2379, "idiom": "toy with", "meaning": "（考えなど）をいい加減に抱く", "ex_en": "Actually, I'm toying with the idea of leaving my job, although I haven't completely made my mind up yet.", "ex_ja": "実は、まだ完全に決断したわけではないが、仕事を辞めることを少し考えているんです。", "core": "アイデアを「軽い気持ちで弄ぶ」。本気でない検討。", "syn": "play with（遊ぶ）／ flirt with（堅・気を引く）／ entertain（堅・検討）", "word_key": "toy with", "word_def": "(句) (考えを) 弄ぶ、軽く検討する。toy=おもちゃ。【類】play with, flirt with"}, {"id": 2380, "idiom": "trail off", "meaning": "次第に小さくなる（= tail off）", "ex_en": "The boy began his recitation well but then he trailed off in silence.", "ex_ja": "少年は上手に暗唱を始めたが、声が次第に小さくなり静まった。", "core": "声・話・興味が「だんだん消えていく」。", "syn": "tail off（=同義）／ die away（消える）／ peter out（尻すぼみ）", "word_key": "trail off", "word_def": "(句動) (声・話が) 次第に消えていく。trail=後を追う／跡。【類】tail off, die away"}, {"id": 2381, "idiom": "trim down", "meaning": "～を削減する（= cut back on, pare down）", "ex_en": "All the executives were asked to trim down their expenses in the coming year.", "ex_ja": "重役全員、来年度の経費を削減するよう求められた。", "core": "贅肉・経費・人員を「ぐっと削減する」。", "syn": "cut back on（=同義）／ pare down（削る）／ slim down（スリム化）", "word_key": "trim down", "word_def": "(句動) (脂肪・経費を) 削ぎ落とす。trim=切り整える。【類】cut back, pare down, slim"}, {"id": 2382, "idiom": "trip over", "meaning": "つまずく（= fall down）", "ex_en": "He tripped over as he ran for the bus and broke his wrist.", "ex_ja": "彼はバスに乗ろうと走った時につまずき、手首を骨折した。", "core": "足を引っかけて「つまずく・転ぶ」。", "syn": "stumble（堅・つまずく）／ trip up（つまずく）／ fall（転倒）", "word_key": "trip", "word_def": "(動) つまずく／(名)旅行。trip over=つまずく。【関】tripping=つまずいて／面白い"}, {"id": 2383, "idiom": "trump up", "meaning": "～をでっち上げる（= cook up, fabricate, fake）", "ex_en": "He said the police had trumped up the charges in order to punish him.", "ex_ja": "警察が彼を罰するためにでっち上げた容疑だ、と彼は言った。", "core": "罪・容疑・話を「捏造する」。冤罪の含意。", "syn": "fabricate（堅・捏造）／ frame（はめる）／ cook up（でっち上げ）", "word_key": "trump up", "word_def": "(句動) (容疑を) でっち上げる。trump=切り札／勝つ。【類】fabricate, frame, cook up"}, {"id": 2384, "idiom": "turn over a new leaf", "meaning": "心を入れ替える（= begin a new life）", "ex_en": "After he got married, he turned over a new leaf and stopped drinking altogether.", "ex_ja": "結婚してから、彼は心を入れ替えて、酒を一切やめた。", "core": "過去を捨て「心機一転やり直す」。新生のニュアンス。", "syn": "make a fresh start（出直し）／ start over（やり直す）／ reform oneself（更生）", "word_key": "turn over a new leaf", "word_def": "(句) (本のページをめくるように) 心機一転する。leaf=葉／(本の)ページ"}, {"id": 2385, "idiom": "vouch for", "meaning": "～を保証する（= guarantee, endorse）", "ex_en": "Is there anyone who can vouch for the truth of what you say?", "ex_ja": "君が言っていることが事実だと保証できる人は、誰かいるのかい？", "core": "品質・信用を「保証する」。証言・推薦に使う。", "syn": "guarantee（堅・保証）／ endorse（堅・推薦）／ attest to（堅・証明）", "word_key": "vouch for", "word_def": "(句) 〜を保証する、請け合う。【類】guarantee, attest to, endorse"}, {"id": 2386, "idiom": "walk out on", "meaning": "（人）のもとを去る（= leave）", "ex_en": "One day she just got up and walked out on her husband.", "ex_ja": "ある日、彼女はただ立ち上がると、夫の元を去った。", "core": "配偶者・職場を「予告なく置き去りにする」。", "syn": "abandon（堅・捨てる）／ desert（堅・見捨てる）／ leave（去る）", "word_key": "walk out on", "word_def": "(句) 〜のもとを去る、見捨てる。【類】abandon, desert, leave"}, {"id": 2387, "idiom": "wash out", "meaning": "（試合などを）（雨で）中止にさせる／～を疲れさせる（= rain out, fatigue）", "ex_en": "Persistent rain washed out the second day of the tennis tournament.", "ex_ja": "降り続く雨のため、テニス大会の2日目は雨天中止になった。", "core": "①雨で試合が中止 ②疲労で抜け殻状態。", "syn": "rain out（雨で中止）／ exhaust（堅・消耗）／ drain（疲弊）", "word_key": "wash out", "word_def": "(句動) (雨で) 中止になる／(色が) 落ちる／(疲れて) 抜け殻になる。多義"}, {"id": 2388, "idiom": "weed out", "meaning": "～を取り除く（= remove）", "ex_en": "The background check was designed to weed out troublemakers from the organization.", "ex_ja": "そのバックグラウンドチェックは、組織から問題のある人を取り除くことを目的に作られた。", "core": "不適格者・雑草を「選別して取り除く」。", "syn": "filter out（フィルタリング）／ eliminate（堅・排除）／ root out（根絶）", "word_key": "weed", "word_def": "(名) 雑草 (動) 雑草を抜く。weed out=不要なものを取り除く。【類】remove, eliminate"}, {"id": 2389, "idiom": "weigh in", "meaning": "（議論などに）割り込む（= const CHAPTERS = [
  { name: '第1章', range: [2101, 2200], label: '2101 〜 2200' },
  { name: '第2章', range: [2201, 2300], label: '2201 〜 2300' },
  { name: '第3章', range: [2301, 2400], label: '2301 〜 2400' },
];
let state = { questions: [], current: 0, score: 0, answers: [], answered: false, lastChapter: null };

function shuffle(a) { a = [...a]; for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function getWrongStash() { try { return JSON.parse(localStorage.getItem('eiken1_wrong')||'[]'); } catch(e) { return []; } }
function saveWrongStash(ids) { localStorage.setItem('eiken1_wrong', JSON.stringify(ids)); }
function getUncertainStash() { try { return JSON.parse(localStorage.getItem('eiken1_uncertain')||'[]'); } catch(e) { return []; } }
function saveUncertainStash(ids) { localStorage.setItem('eiken1_uncertain', JSON.stringify(ids)); }
function getHistory() { try { return JSON.parse(localStorage.getItem('eiken1_history')||'[]'); } catch(e) { return []; } }
function saveHistory(h) { localStorage.setItem('eiken1_history', JSON.stringify(h)); }
function pushHistory(entry) { const h = getHistory(); h.unshift(entry); if (h.length > 200) h.length = 200; saveHistory(h); }

function exportData() {
  const data = {
    version: 1,
    exported_at: new Date().toISOString(),
    eiken1_wrong: getWrongStash(),
    eiken1_uncertain: getUncertainStash(),
    eiken1_history: getHistory(),
    eiken1_known: (function(){ try { return JSON.parse(localStorage.getItem('eiken1_known')||'[]'); } catch(e) { return []; } })(),
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  a.download = `eiken1_backup_${ts}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!confirm('バックアップを読み込みますか？\n間違えた: ' + (data.eiken1_wrong||[]).length + ' 個\n自信ない: ' + (data.eiken1_uncertain||[]).length + ' 個\n履歴: ' + (data.eiken1_history||[]).length + ' 件\n習得済み: ' + (data.eiken1_known||[]).length + ' 個\n\n（既存データは上書きされます）')) return;
        if (data.eiken1_wrong) saveWrongStash(data.eiken1_wrong);
        if (data.eiken1_uncertain) saveUncertainStash(data.eiken1_uncertain);
        if (data.eiken1_history) saveHistory(data.eiken1_history);
        if (data.eiken1_known) localStorage.setItem('eiken1_known', JSON.stringify(data.eiken1_known));
        alert('インポート完了！');
        renderChapters();
      } catch(err) { alert('インポート失敗: ' + err.message); }
    };
    reader.readAsText(f);
  };
  input.click();
}

function showHistory() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('history-screen').classList.remove('hidden');
  const h = getHistory();
  document.getElementById('history-count').textContent = h.length;
  const wrap = document.getElementById('history-content');
  wrap.innerHTML = '';
  if (h.length === 0) {
    wrap.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--text-dim);font-size:14px;">まだクイズの履歴はありません</div>';
    return;
  }
  h.forEach(e => {
    const it = document.createElement('div');
    it.className = 'review-item correct';
    const pct = Math.round(e.score / e.total * 100);
    const date = new Date(e.date);
    const dateStr = date.toLocaleString('ja-JP', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    let label = e.label || '';
    let medal = pct === 100 ? '🏆' : pct >= 85 ? '🌟' : pct >= 65 ? '👍' : pct >= 40 ? '💪' : '📚';
    it.innerHTML = '<div class="ri-idiom">' + medal + ' ' + label + ' <span style="color:var(--text-dim);font-size:11px;font-weight:400;margin-left:8px;">' + dateStr + '</span></div><div class="ri-meaning">' + e.score + ' / ' + e.total + ' 正解 (' + pct + '%)</div>';
    wrap.appendChild(it);
  });
}
function clearHistory() {
  if (confirm('履歴を全て消去しますか？')) { saveHistory([]); showHistory(); }
}

function renderChapters() {
  const list = document.getElementById('chapter-list');
  list.innerHTML = '';
  const wrongStash = getWrongStash();
  const uncertainStash = getUncertainStash();
  CHAPTERS.forEach((c, i) => {
    const cards = QUIZ_DATA.filter(d => d.id >= c.range[0] && d.id <= c.range[1]);
    const wrongHere = cards.filter(d => wrongStash.includes(d.id)).length;
    const uncertainHere = cards.filter(d => uncertainStash.includes(d.id)).length;
    const btn = document.createElement('button');
    btn.className = 'chapter-btn';
    let meta = 'No. ' + c.label + ' / 100問';
    const tags = [];
    if (wrongHere > 0) tags.push('間違い ' + wrongHere);
    if (uncertainHere > 0) tags.push('自信ない ' + uncertainHere);
    if (tags.length) meta += '  ・  ' + tags.join(' ／ ');
    btn.innerHTML = '<div class="ch-title">' + c.name + '</div><div class="ch-meta">' + meta + '</div>';
    btn.onclick = () => startQuiz(i);
    list.appendChild(btn);
  });
  const wcnt = wrongStash.length;
  const ucnt = uncertainStash.length;
  document.getElementById('wrong-stash-count').textContent = wcnt;
  document.getElementById('wrong-stash-count2').textContent = wcnt;
  document.getElementById('uncertain-stash-count').textContent = ucnt;
  document.getElementById('uncertain-stash-count2').textContent = ucnt;
  const rb = document.getElementById('review-btn');
  rb.disabled = wcnt === 0;
  rb.style.opacity = wcnt === 0 ? '0.4' : '1';
  const ub = document.getElementById('uncertain-btn');
  ub.disabled = ucnt === 0;
  ub.style.opacity = ucnt === 0 ? '0.4' : '1';
}

function _renderListGeneric(stash, listElId, countElId, emptyMsg, btnId) {
  const items = QUIZ_DATA.filter(d => stash.includes(d.id));
  document.getElementById(countElId).textContent = items.length;
  const wrap = document.getElementById(listElId);
  wrap.innerHTML = '';
  const btn = document.getElementById(btnId);
  if (items.length === 0) {
    wrap.innerHTML = '<div style="text-align:center;padding:40px 20px;color:var(--text-dim);font-size:14px;">' + emptyMsg + '</div>';
    if (btn) { btn.disabled = true; btn.style.opacity = '0.4'; }
    return;
  }
  if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
  items.forEach(d => {
    const it = document.createElement('div');
    it.className = 'review-item';
    let h = '<div class="ri-idiom">' + d.idiom + '<span style="color:var(--text-dim);font-size:11px;font-weight:400;margin-left:8px;">No.' + d.id + '</span></div>';
    h += '<div class="ri-meaning">' + d.meaning + '</div>';
    h += '<div style="margin-top:6px;color:#cbd5e1;font-size:12px;line-height:1.5;">' + d.ex_en + '</div>';
    if (d.ex_ja) h += '<div style="color:var(--text-dim);font-size:11px;line-height:1.5;">' + d.ex_ja + '</div>';
    it.innerHTML = h;
    wrap.appendChild(it);
  });
}

function startQuiz(chapterIdx) {
  const c = CHAPTERS[chapterIdx];
  const pool = QUIZ_DATA.filter(d => d.id >= c.range[0] && d.id <= c.range[1]);
  state = { questions: shuffle(pool), current: 0, score: 0, answers: [], answered: false, lastChapter: chapterIdx };
  showQuiz();
}
function startQuizMix() {
  state = { questions: shuffle(QUIZ_DATA).slice(0, 20), current: 0, score: 0, answers: [], answered: false, lastChapter: 'mix' };
  showQuiz();
}
function startReview() {
  const stash = getWrongStash();
  const pool = QUIZ_DATA.filter(d => stash.includes(d.id));
  if (pool.length === 0) return;
  state = { questions: shuffle(pool), current: 0, score: 0, answers: [], answered: false, lastChapter: 'review' };
  showQuiz();
}
function startUncertainReview() {
  const stash = getUncertainStash();
  const pool = QUIZ_DATA.filter(d => stash.includes(d.id));
  if (pool.length === 0) return;
  state = { questions: shuffle(pool), current: 0, score: 0, answers: [], answered: false, lastChapter: 'uncertain' };
  showQuiz();
}
function restartLast() {
  if (state.lastChapter === 'review') startReview();
  else if (state.lastChapter === 'uncertain') startUncertainReview();
  else if (state.lastChapter === 'mix') startQuizMix();
  else if (typeof state.lastChapter === 'number') startQuiz(state.lastChapter);
}
function clearWrongStash() {
  if (confirm('間違えたリストを全て消去しますか？')) { saveWrongStash([]); showWrongList(); }
}
function clearUncertainStash() {
  if (confirm('自信ないリストを全て消去しますか？')) { saveUncertainStash([]); showUncertainList(); }
}
function abortQuiz() { if (confirm('中断してトップに戻りますか？')) goHome(); }
function goHome() {
  document.getElementById('wrong-list-screen').classList.add('hidden');
  document.getElementById('uncertain-list-screen').classList.add('hidden');
  document.getElementById('history-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('start-screen').classList.remove('hidden');
  renderChapters();
}

function showQuiz() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('wrong-list-screen').classList.add('hidden');
  document.getElementById('uncertain-list-screen').classList.add('hidden');
  document.getElementById('history-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  document.getElementById('q-total').textContent = state.questions.length;
  renderQuestion();
}

function renderQuestion() {
  const q = state.questions[state.current];
  const prevAnswer = state.answers[state.current];
  state.answered = !!prevAnswer;
  document.getElementById('q-num').textContent = state.current + 1;
  document.getElementById('q-score').textContent = state.score;
  document.getElementById('q-id').textContent = q.id;
  document.getElementById('q-idiom').textContent = q.idiom;
  document.getElementById('progress-fill').style.width = ((state.current) / state.questions.length * 100) + '%';

  // Build choices: if previously answered, restore the SAME shuffled choices and selection
  let choices;
  if (prevAnswer && prevAnswer.choices) {
    choices = prevAnswer.choices;
  } else {
    const wrongs = shuffle(QUIZ_DATA.filter(d => d.id !== q.id)).slice(0,3);
    choices = shuffle([q, ...wrongs]);
  }
  const cEl = document.getElementById('q-choices');
  cEl.innerHTML = '';
  state.currentChoices = choices;
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = c.meaning;
    btn.onclick = () => selectAnswer(c, btn, q);
    cEl.appendChild(btn);
  });

  if (prevAnswer) {
    // Mark answered state
    [...cEl.children].forEach(c => {
      c.disabled = true;
      if (c.textContent === q.meaning) c.classList.add('correct');
      if (c.textContent === prevAnswer.picked.meaning && !prevAnswer.correct) c.classList.add('wrong');
    });
    // Show feedback
    const fb = document.getElementById('q-feedback');
    fb.className = 'feedback';
    let html = '<div class="label">例文</div><div class="ex-en">' + q.ex_en + '</div>';
    if (q.ex_ja) html += '<div class="ex-ja">' + q.ex_ja + '</div>';
    if (q.core) html += '<div class="label" style="margin-top:8px">解説</div><div class="core">' + q.core + '</div>';
    if (q.syn) html += '<div class="label" style="margin-top:8px">類義語</div><div class="syn">' + q.syn + '</div>';
    if (q.word_def) html += '<div class="label" style="margin-top:8px">📖 単語: <span style="color:var(--gold);text-transform:none;letter-spacing:0;font-size:13px;font-weight:700;">' + (q.word_key||'') + '</span></div><div class="core" style="color:#fde68a">' + q.word_def + '</div>';
    fb.innerHTML = html;
    document.getElementById('next-btn').classList.remove('hidden');
    document.getElementById('next-btn').textContent = state.current === state.questions.length - 1 ? '結果を見る →' : '次の問題 →';
  } else {
    document.getElementById('q-feedback').classList.add('hidden');
    document.getElementById('next-btn').classList.add('hidden');
  }
  // Show uncertain button at question render so user can mark before answering
  updateUncertainBtn(q);
  document.getElementById('uncertain-toggle-btn').classList.remove('hidden');
}

function selectAnswer(choice, btnEl, q) {
  if (state.answered) return;
  state.answered = true;
  const correct = choice.id === q.id;
  if (correct) { state.score++; btnEl.classList.add('correct'); }
  else {
    btnEl.classList.add('wrong');
    [...document.getElementById('q-choices').children].forEach(c => { if (c.textContent === q.meaning) c.classList.add('correct'); });
    const stash = getWrongStash();
    if (!stash.includes(q.id)) { stash.push(q.id); saveWrongStash(stash); }
  }
  [...document.getElementById('q-choices').children].forEach(c => c.disabled = true);
  state.answers[state.current] = { q, correct, picked: choice, choices: state.currentChoices };
  const fb = document.getElementById('q-feedback');
  fb.className = 'feedback';
  let html = '<div class="label">例文</div>';
  html += '<div class="ex-en">' + q.ex_en + '</div>';
  if (q.ex_ja) html += '<div class="ex-ja">' + q.ex_ja + '</div>';
  if (q.core) html += '<div class="label" style="margin-top:8px">解説</div><div class="core">' + q.core + '</div>';
  if (q.syn) html += '<div class="label" style="margin-top:8px">類義語</div><div class="syn">' + q.syn + '</div>';
  if (q.word_def) html += '<div class="label" style="margin-top:8px">📖 単語: <span style="color:var(--gold);text-transform:none;letter-spacing:0;font-size:13px;font-weight:700;">' + (q.word_key||'') + '</span></div><div class="core" style="color:#fde68a">' + q.word_def + '</div>';
  fb.innerHTML = html;
  document.getElementById('next-btn').classList.remove('hidden');
  document.getElementById('next-btn').textContent = state.current === state.questions.length - 1 ? '結果を見る →' : '次の問題 →';
  document.getElementById('q-score').textContent = state.score;
  // Uncertain toggle button
  updateUncertainBtn(q);
  document.getElementById('uncertain-toggle-btn').classList.remove('hidden');
}

function updateUncertainBtn(q) {
  const btn = document.getElementById('uncertain-toggle-btn');
  const stash = getUncertainStash();
  if (stash.includes(q.id)) {
    btn.textContent = '✓ 自信ないリストに登録済み（クリックで解除）';
    btn.style.background = '#92400e';
  } else {
    btn.textContent = '🤔 自信ないとしてマーク';
    btn.style.background = '#f59e0b';
  }
}

function toggleUncertain() {
  const q = state.questions[state.current];
  const stash = getUncertainStash();
  const idx = stash.indexOf(q.id);
  if (idx >= 0) stash.splice(idx, 1);
  else stash.push(q.id);
  saveUncertainStash(stash);
  updateUncertainBtn(q);
}

function prevQuestion() {
  if (state.current === 0) return;
  state.current--;
  renderQuestion();
}

function nextQuestion() {
  state.current++;
  if (state.current >= state.questions.length) showResult();
  else renderQuestion();
}

function showResult() {
  // Save quiz history
  const labels = { review: '🔄 間違えた復習', uncertain: '🤔 自信ない復習', mix: '3章ミックス20問' };
  const label = (typeof state.lastChapter === 'number')
    ? CHAPTERS[state.lastChapter].name + ' (' + CHAPTERS[state.lastChapter].label + ')'
    : (labels[state.lastChapter] || 'クイズ');
  pushHistory({ date: new Date().toISOString(), label, score: state.score, total: state.questions.length });
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  document.getElementById('r-score').textContent = state.score;
  document.getElementById('r-total').textContent = state.questions.length;
  const pct = state.score / state.questions.length;
  let msg;
  if (pct === 1) msg = '🏆 パーフェクト！';
  else if (pct >= 0.85) msg = '🌟 優秀！合格圏内';
  else if (pct >= 0.65) msg = '👍 まずまず！';
  else if (pct >= 0.4) msg = '💪 復習がんばろう';
  else msg = '📚 焦らずコツコツ';
  document.getElementById('r-message').textContent = msg;
  // Auto-clean wrong stash for correctly-answered (review mode)
  const stash = getWrongStash();
  state.answers.forEach(a => { if (a.correct) { const i = stash.indexOf(a.q.id); if (i>=0) stash.splice(i,1); } });
  saveWrongStash(stash);
  // Auto-clean uncertain stash for correctly-answered (in uncertain review)
  if (state.lastChapter === 'uncertain') {
    const ust = getUncertainStash();
    state.answers.forEach(a => { if (a.correct) { const i = ust.indexOf(a.q.id); if (i>=0) ust.splice(i,1); } });
    saveUncertainStash(ust);
  }
  const review = document.getElementById('r-review');
  review.innerHTML = '';
  const sorted = [...state.answers].sort((a,b) => Number(a.correct) - Number(b.correct));
  sorted.forEach(a => {
    const item = document.createElement('div');
    item.className = 'review-item' + (a.correct ? ' correct' : '');
    let h = '<div class="ri-idiom">' + (a.correct?'✓ ':'✗ ') + a.q.idiom + '<span style="color:var(--text-dim);font-size:11px;font-weight:400;margin-left:8px;">No.' + a.q.id + '</span></div>';
    h += '<div class="ri-meaning">' + a.q.meaning + '</div>';
    if (!a.correct) h += '<div class="ri-wrong">あなたの解答: ' + a.picked.meaning + '</div>';
    item.innerHTML = h;
    review.appendChild(item);
  });
}

// Keyboard shortcuts on quiz screen
document.addEventListener('keydown', e => {
  const onQuiz = !document.getElementById('quiz-screen').classList.contains('hidden');
  if (!onQuiz) return;
  // Skip if user is typing in an input
  if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) return;

  // Numbers 1-4: select answer (only if not yet answered)
  if (['1','2','3','4'].includes(e.key)) {
    const idx = parseInt(e.key, 10) - 1;
    const choices = document.getElementById('q-choices').children;
    if (!state.answered && choices[idx] && !choices[idx].disabled) {
      e.preventDefault();
      choices[idx].click();
    }
    return;
  }
  // M: toggle uncertain
  if (e.key === 'm' || e.key === 'M') {
    e.preventDefault();
    toggleUncertain();
    return;
  }
  // ArrowLeft: previous question
  if (e.key === 'ArrowLeft' && state.current > 0) {
    e.preventDefault();
    prevQuestion();
    return;
  }
  // ArrowRight or Enter: next question (only if answered)
  if ((e.key === 'ArrowRight' || e.key === 'Enter') && state.answered) {
    e.preventDefault();
    nextQuestion();
    return;
  }
});

renderChapters();
</script>
</body></html>
